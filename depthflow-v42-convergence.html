<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MicroPlayer V42</title><style>html,body{margin:0;background:#0b0c10;color:#f5f7fa;font-family:-apple-system,system-ui}.panel{position:sticky;top:0;z-index:20;background:#15171df7;border-bottom:1px solid #292d36;padding:10px 16px}.panel h2{margin:0 0 6px}.ctl{display:grid;grid-template-columns:180px 1fr 70px;gap:8px;align-items:center;max-width:1050px;margin:7px auto}.ctl input{width:100%}.note{max-width:1050px;margin:auto;font-size:13px;color:#ddd}iframe{border:0;width:100%;height:calc(100vh - 205px);display:block}</style></head><body><div class="panel"><h2>V42 — convergence / plan zéro</h2><div class="ctl"><label>Plan zéro</label><input id="zero" type="range" min="32" max="224" step="1" value="128"><output id="zo">128</output></div><div class="ctl"><label>Amplitude vues</label><input id="amp" type="range" min="50" max="300" step="5" value="130"><output id="ao">130 %</output></div><div class="note">Plan zéro = profondeur qui reste stable. 128 = milieu. Déplace-le vers la profondeur du sujet principal pour l'ancrer, puis augmente l'amplitude. La vue 05 reste l'original.</div></div><iframe id="app"></iframe><script>const f=document.getElementById('app'),z=document.getElementById('zero'),a=document.getElementById('amp'),zo=document.getElementById('zo'),ao=document.getElementById('ao');async function boot(){let t=await fetch('depthflow-v40-relief.html').then(r=>r.text());t=t.replace("<title>MicroPlayer V40</title>","<title>MicroPlayer V42 moteur</title>");t=t.replace("z=d[i]/255-.5,sx=", "z=d[i]/255-(window.parent.__V42ZERO??0.5),sx=");t=t.replace("let relief=+$('relief').value/100;", "let relief=(window.parent.__V42AMP??1.3);");f.srcdoc=t}function sync(){zo.textContent=z.value;ao.textContent=a.value+' %';window.__V42ZERO=(+z.value)/255;window.__V42AMP=(+a.value)/100}z.oninput=sync;a.oninput=sync;sync();boot();</script></body></html>
