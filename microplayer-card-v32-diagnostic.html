<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>MicroPlayer V32 Diagnostic</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090a0d;color:#fff}*{box-sizing:border-box}body{margin:0}.top{padding:14px 18px;background:#101217;border-bottom:1px solid #303541;position:sticky;top:0;z-index:5}.wrap{max-width:1500px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:330px 1fr;gap:14px}.panel{background:#15171c;border:1px solid #303541;border-radius:16px;padding:14px;margin-bottom:12px}.views{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stage{position:relative;background:#050506;border-radius:12px;overflow:hidden;min-height:220px}.stage canvas{display:block;width:100%;height:auto}.stage .overlay{position:absolute;inset:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}button,input,select{font:inherit}button{min-height:44px;border:0;border-radius:10px;background:#2d323d;color:#fff;font-weight:750;padding:9px}button.primary{background:#1687ff}input[type=file],select{width:100%}.status{background:#20242d;border-radius:10px;padding:10px;font-size:12px;margin-top:8px}.group{border:1px solid #3a3f4b;border-radius:12px;padding:9px;margin:8px 0}.group.sel{border:2px solid #1687ff}.group .row{display:flex;gap:8px;align-items:center}.group .row b{flex:1}.group input[type=range]{width:100%}.small{font-size:12px;color:#adb4c1}.legend{display:flex;flex-wrap:wrap;gap:7px;font-size:11px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px}@media(max-width:900px){.grid,.views{grid-template-columns:1fr}}</style></head>
<body><header class="top"><b>MicroPlayer — Carte V32 diagnostic</b> · compréhension → groupes → profondeur</header>
<main class="wrap"><div class="grid"><aside>
<section class="panel"><h2>1. Carte</h2><input id="file" type="file" accept="image/*"><p class="small">Cette page ne génère volontairement pas les 9 vues. Elle valide d'abord la structure.</p><button id="analyze" class="primary" disabled style="width:100%">Analyser la carte</button><div id="status" class="status">Importez une carte.</div></section>
<section class="panel"><h2>2. Groupes</h2><div id="groups"><span class="small">En attente.</span></div></section>
</aside><section>
<div class="views">
<section class="panel"><h2>Original</h2><div class="stage"><canvas id="original"></canvas></div></section>
<section class="panel"><h2>Groupes reconnus</h2><div class="stage"><canvas id="groupBase"></canvas><canvas id="overlay" class="overlay"></canvas></div><div id="legend" class="legend"></div></section>
<section class="panel"><h2>Masque sélectionné</h2><div class="stage"><canvas id="mask"></canvas></div></section>
<section class="panel"><h2>Depth map V32</h2><div class="stage"><canvas id="depth"></canvas></div><div id="qc" class="status">QC en attente.</div></section>
</div></section></div></main>
<script type="module">
import{createSemanticMask,createBoxMask,maskCoverage}from'./business-card-depthflow-core.js';
const $=id=>document.getElementById(id), C=['#00e5ff','#ffca28','#ef5350','#66bb6a','#ab47bc','#42a5f5','#ff7043','#26a69a','#ec407a','#9ccc65','#7e57c2','#ffa726'];
const S={img:null,data:null,rgba:null,w:0,h:0,groups:[],sel:null}; const load=u=>new Promise((r,j)=>{const i=new Image;i.onload=()=>r(i);i.onerror=j;i.src=u});
function fitCanvas(c,w,h){c.width=w;c.height=h} function drawImage(c){fitCanvas(c,S.w,S.h);c.getContext('2d').drawImage(S.img,0,0,S.w,S.h)}
function semanticDepth(role,type){const r=String(role||'').toLowerCase(),t=String(type||'').toLowerCase();if(r.includes('logo'))return 230;if(r.includes('name')||r.includes('identity'))return 215;if(r.includes('role')||r.includes('title'))return 190;if(r.includes('phone')||r.includes('email')||r.includes('web'))return 170;if(r.includes('address')||r.includes('social'))return 155;if(r.includes('decor'))return 110;if(t==='text')return 175;return 140}
function mk(x,i){const g={id:String(x.groupId||x.id||i),label:x.label||x.text||x.role||('Groupe '+(i+1)),role:x.role||'other',type:x.type||'object',bbox:x.bbox||[.1,.1,.2,.1],depth:semanticDepth(x.role,x.type),color:C[i%C.length]};let m=createSemanticMask(S.rgba,S.w,S.h,g.bbox,{threshold:g.type==='text'?24:36,softness:8,dilate:0});if(maskCoverage(m).percent<.005)m=createBoxMask(S.w,S.h,g.bbox,1);g.mask=m;return g}
function bboxPx(b){let[x,y,w,h]=b;if(x<=1&&y<=1&&w<=1&&h<=1)return[x*S.w,y*S.h,w*S.w,h*S.h];return[x,y,w,h]}
function render(){drawImage($('groupBase'));const o=$('overlay'),x=o.getContext('2d');fitCanvas(o,S.w,S.h);x.clearRect(0,0,S.w,S.h);S.groups.forEach((g,i)=>{const[bX,bY,bW,bH]=bboxPx(g.bbox);x.strokeStyle=g.color;x.lineWidth=Math.max(2,S.w/600);x.strokeRect(bX,bY,bW,bH);x.fillStyle=g.color;x.font=Math.max(12,S.w/70)+'px sans-serif';x.fillText(String(i+1),bX+4,bY+Math.max(14,S.w/70))});renderMask();renderDepth();renderList()}
function renderMask(){const c=$('mask');fitCanvas(c,S.w,S.h);const x=c.getContext('2d'),g=S.groups.find(q=>q.id===S.sel);x.drawImage(S.img,0,0,S.w,S.h);if(!g)return;const im=x.getImageData(0,0,S.w,S.h);for(let i=0,j=0;i<g.mask.length;i++,j+=4){if(g.mask[i]>20){im.data[j]=20;im.data[j+1]=225;im.data[j+2]=255;im.data[j+3]=255}else{im.data[j]*=.22;im.data[j+1]*=.22;im.data[j+2]*=.22}}x.putImageData(im,0,0)}
function renderDepth(){const c=$('depth');fitCanvas(c,S.w,S.h);const x=c.getContext('2d'),d=new Uint8ClampedArray(S.w*S.h);d.fill(128);const ordered=[...S.groups].sort((a,b)=>a.depth-b.depth);for(const g of ordered)for(let i=0;i<d.length;i++)if(g.mask[i]>90)d[i]=g.depth;const im=x.createImageData(S.w,S.h);for(let i=0,j=0;i<d.length;i++,j+=4){im.data[j]=im.data[j+1]=im.data[j+2]=d[i];im.data[j+3]=255}x.putImageData(im,0,0);const vals=S.groups.map(g=>g.depth);$('qc').textContent=S.groups.length?('QC : '+S.groups.length+' groupes · amplitude '+(Math.max(...vals)-Math.min(...vals))+'/255 · vue centrale à préserver pixel pour pixel.'):'Aucun groupe.'}
function renderList(){const root=$('groups');root.innerHTML='';S.groups.forEach((g,i)=>{const d=document.createElement('div');d.className='group'+(g.id===S.sel?' sel':'');d.innerHTML='<div class="row"><span style="width:11px;height:11px;border-radius:50%;background:'+g.color+'"></span><b>'+esc(g.label)+'</b><button>Voir</button></div><div class="small">'+esc(g.role)+' · '+esc(g.type)+' · masque '+maskCoverage(g.mask).percent.toFixed(2)+'%</div><label>Profondeur <b class="v">'+g.depth+'</b></label><input type="range" min="0" max="255" value="'+g.depth+'">';d.querySelector('button').onclick=()=>{S.sel=g.id;render()};d.querySelector('input').oninput=e=>{g.depth=+e.target.value;d.querySelector('.v').textContent=g.depth;renderDepth()};root.appendChild(d)});$('legend').innerHTML=S.groups.map((g,i)=>'<span><i class="dot" style="background:'+g.color+'"></i>'+(i+1)+' '+esc(g.label)+'</span>').join('')}
function esc(s){return String(s).replace(/[&<>"]/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[a]))}
$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;S.data=await new Promise((r,j)=>{const q=new FileReader;q.onload=()=>r(q.result);q.onerror=j;q.readAsDataURL(f)});S.img=await load(S.data);const max=1800,scale=Math.min(1,max/S.img.naturalWidth);S.w=Math.round(S.img.naturalWidth*scale);S.h=Math.round(S.img.naturalHeight*scale);drawImage($('original'));drawImage($('groupBase'));const tmp=document.createElement('canvas');fitCanvas(tmp,S.w,S.h);const tx=tmp.getContext('2d');tx.drawImage(S.img,0,0,S.w,S.h);S.rgba=tx.getImageData(0,0,S.w,S.h).data;S.groups=[];S.sel=null;$('analyze').disabled=false;$('status').textContent='Carte chargée '+S.w+' × '+S.h+'. Analyse prête.'};
$('analyze').onclick=async()=>{try{$('status').textContent='Analyse sémantique…';const r=await fetch('/api/card-layer-analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:S.data})}),d=await r.json();if(!r.ok)throw Error(d.error||('HTTP '+r.status));S.groups=(d.layers||[]).map(mk);S.sel=S.groups[0]?.id||null;render();$('status').textContent=S.groups.length+' groupes reçus. Vérifiez maintenant découpage et profondeur.'}catch(e){$('status').textContent='Erreur analyse : '+e.message}}
</script></body></html>
