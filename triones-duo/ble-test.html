<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Triones BLE Test</title><style>body{font-family:-apple-system,sans-serif;background:#0b0d12;color:#fff;margin:0;padding:20px}button{display:block;width:100%;padding:18px;margin:12px 0;border:0;border-radius:14px;font-size:18px;font-weight:700;background:#2764d8;color:#fff}.on{background:#247a4b}.off{background:#943744}pre{white-space:pre-wrap;background:#171b24;padding:14px;border-radius:12px;min-height:120px}.ok{color:#6ee7a8}.bad{color:#ff7b88}</style></head><body><h1>Triones BLE TEST</h1><p>Test direct validé QuickBlue : service FFD5 → écriture FFD9.</p><div id="support"></div><button id="connect">1 — CONNECTER UN TRIONES</button><button id="on" class="on">2 — ON (CC2333)</button><button id="off" class="off">3 — OFF (CC2433)</button><pre id="log">Prêt.</pre><script>
const SERVICE='0000ffd5-0000-1000-8000-00805f9b34fb';
const WRITE='0000ffd9-0000-1000-8000-00805f9b34fb';
let device=null,char=null;
const log=m=>document.getElementById('log').textContent='['+new Date().toLocaleTimeString()+'] '+m+'\n'+document.getElementById('log').textContent;
function support(){const b=!!navigator.bluetooth;document.getElementById('support').innerHTML=b?'<p class="ok">navigator.bluetooth = OUI</p>':'<p class="bad">navigator.bluetooth = NON — cette page doit être ouverte directement dans Bluefy.</p>';log('URL: '+location.href);log('HTTPS: '+(location.protocol==='https:'));log('navigator.bluetooth: '+b);}
async function connect(){log('CLIC CONNECT reçu');if(!navigator.bluetooth){log('STOP: navigator.bluetooth absent');alert('Bluetooth Web absent. Vérifie que cette URL est réellement ouverte dans Bluefy.');return}try{log('requestDevice()…');device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'Triones-'}],optionalServices:[SERVICE]});log('Choisi: '+(device.name||'?')+' / '+(device.id||'?'));const server=await device.gatt.connect();log('GATT connecté');const service=await server.getPrimaryService(SERVICE);log('FFD5 trouvé');char=await service.getCharacteristic(WRITE);log('FFD9 trouvé — PRÊT');}catch(e){log((e.name||'Erreur')+': '+e.message);alert((e.name||'Erreur')+': '+e.message)}}
async function send(bytes,label){log('CLIC '+label+' reçu');if(!char){log('Pas de FFD9: connecte d’abord');alert('Connecte d’abord un Triones.');return}try{const data=new Uint8Array(bytes);if(char.properties.writeWithoutResponse&&char.writeValueWithoutResponse)await char.writeValueWithoutResponse(data);else await char.writeValue(data);log(label+' envoyé avec succès');}catch(e){log('WRITE '+(e.name||'Erreur')+': '+e.message);alert('WRITE: '+e.message)}}
document.getElementById('connect').onclick=connect;document.getElementById('on').onclick=()=>send([0xCC,0x23,0x33],'ON CC2333');document.getElementById('off').onclick=()=>send([0xCC,0x24,0x33],'OFF CC2433');support();
</script></body></html>
