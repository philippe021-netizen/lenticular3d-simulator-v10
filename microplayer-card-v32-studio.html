<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <title>MicroPlayer V32 — Atelier lenticulaire</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#090a0d;--panel:#15171c;--line:#303541;--blue:#1687ff;--cyan:#00e5ff}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;z-index:20;padding:13px 18px;background:#0d0e12f2;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.wrap{max-width:1500px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:410px 1fr;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}.stage,.sim{position:relative;aspect-ratio:1.545;background:#050506;border-radius:14px;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}.stage canvas,.sim canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}button,select,input{font:inherit}button{border:0;border-radius:11px;min-height:44px;padding:10px;background:#2d323d;color:#fff;font-weight:800}button.active,button.primary{background:var(--blue)}button.green{background:#177052}button:disabled{opacity:.4}select,input[type=file]{width:100%}.status{padding:10px;margin-top:9px;border-radius:10px;background:#20242d;font-size:12px;white-space:pre-wrap}.ok{background:#17372c}.warn{background:#443a1b}.group{border:1px solid #373c48;border-radius:13px;padding:10px;margin:8px 0}.group.selected{border:2px solid var(--cyan)}.grouphead{display:flex;gap:7px;align-items:center}.grouphead b{flex:1}.group input[type=range]{width:100%}.small{font-size:12px;color:#aab0bd}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.views{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.view{position:relative;aspect-ratio:1.545}.view img{width:100%;height:100%;object-fit:contain}.view span{position:absolute;top:4px;left:4px;background:#000b;padding:3px}.simnav{display:grid;grid-template-columns:45px 1fr 45px 90px;gap:8px}.hidden{display:none!important}.progress{height:7px;border-radius:8px;background:#090a0d;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;width:0;background:var(--cyan);transition:width .2s}@media(max-width:980px){.grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr}.top span{display:none}}
  </style>
</head>
<body>
  <header class="top"><b>MicroPlayer — Carte 3D V32</b><span>OCR verrouillé · Pencil · 9 vues</span></header>
  <main class="wrap"><div class="grid">
    <aside>
      <section class="panel">
        <h2>1. Carte comprise</h2>
        <div id="sourceInfo" class="status">Lecture du scanner V32…</div>
        <div class="actions" style="margin-top:8px"><button id="back">← Scanner</button><button id="depthflow">DepthFlow décor</button></div>
        <div class="progress"><i id="progress"></i></div>
      </section>
      <section class="panel"><h2>2. Groupes</h2><select id="preset"><option value="professional">Pro lisible</option><option value="artistic">Artistique</option><option value="papercut">Découpe papier</option><option value="qr">QR prioritaire</option></select><button id="auto" style="width:100%;margin-top:8px">Répartir automatiquement</button><div id="groups"></div></section>
    </aside>
    <section>
      <section class="panel"><h2>Carte / masque</h2><div id="stage" class="stage"><canvas id="photo"></canvas><canvas id="mask"></canvas></div><div class="actions" style="margin-top:8px"><button id="card" class="active">Carte</button><button id="depthView">Profondeur</button></div></section>
      <section class="panel"><h2>3. Correction Pencil</h2><div class="actions"><button id="add" class="active">Pencil +</button><button id="erase">Gomme</button></div><label>Pinceau <b id="brushOut">18</b><input id="brush" type="range" min="3" max="70" value="18" style="width:100%"></label><div class="actions"><button id="undo" disabled>Annuler</button><button id="resetMask">Masque auto</button></div><div id="pencilStatus" class="status ok">Sélectionne un groupe puis corrige uniquement son masque.</div></section>
      <section class="panel"><h2>4. Relief</h2><div class="controls"><label>Zéro <b id="zeroOut">128</b><input id="zero" type="range" min="0" max="255" value="128"></label><label>Relief <b id="reliefOut">220%</b><input id="relief" type="range" min="80" max="250" value="220"></label><label>Parallaxe <b id="parallaxOut">4.2%</b><input id="parallax" type="range" min="0" max="6" step=".1" value="4.2"></label></div><label>Relief du fond <b id="backgroundOut">12%</b><input id="background" type="range" min="0" max="35" value="12" style="width:100%"></label><div id="report" class="status"></div><button id="generate" class="primary" style="width:100%">Générer les 9 vues</button></section>
      <section id="results" class="panel hidden"><h2>5. Simulation lenticulaire</h2><div class="sim"><canvas id="sim"></canvas></div><div class="simnav"><button id="prev">‹</button><input id="simRange" type="range" min="0" max="8" step="0.01" value="4"><button id="next">›</button><output id="simOut">5 / 9</output></div><div id="views" class="views"></div><div class="actions"><button id="toggle">Pause</button><button id="zip" class="green">ZIP complet</button></div><div id="renderStatus" class="status ok"></div></section>
    </section>
  </div></main>
  <script type="module">
    import { cardDepthSpread, composeSemanticDepth, createCardDepthPreset, createSemanticMask, maskCoverage, paintMask } from './business-card-depthflow-core.js';
    import { comparePixels, renderNovelView } from './depthflow-v42-core.js';

    const $=id=>document.getElementById(id),photo=$('photo'),mask=$('mask'),stage=$('stage');
    const photoContext=photo.getContext('2d',{willReadFrequently:true}),maskContext=mask.getContext('2d');
    const state={payload:null,image:null,rgba:null,width:0,height:0,groups:[],selected:null,mode:'add',preview:'card',baseDepth:null,finalDepth:null,history:[],drawing:false,lastPoint:null,overlayFrame:0,worker:null,requestId:0,views:[],blobs:[],urls:[],renderStats:[],simPosition:4,playing:true,direction:1,lastTime:0,animation:0};
    const loadImage=url=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=url});
    const toBlob=canvas=>new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
    const selected=()=>state.groups.find(group=>group.id===state.selected);
    const escapeHtml=value=>String(value).replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[character]));

    function semanticMaskForGroup(group){
      const combined=new Uint8ClampedArray(state.width*state.height);
      const boxes=group.items.flatMap(item=>item.type==='text'&&item.words?.length?item.words.map(word=>word.bbox):[item.bbox]).filter(Boolean);
      for(const box of boxes){const current=createSemanticMask(state.rgba,state.width,state.height,box,{threshold:group.type==='text'?22:36,softness:group.type==='text'?9:18,close:group.type==='text'?1:(group.role==='artwork'?0:2),dilate:group.type==='text'?0:1,padding:group.type==='text'?.002:.004});for(let index=0;index<combined.length;index++)if(current[index]>combined[index])combined[index]=current[index]}
      return combined;
    }

    function compose(){const layers=state.groups.map(group=>({mask:group.mask,depth:group.depth,enabled:true,internalRelief:['artwork','subject'].includes(group.role)?.18:0}));state.finalDepth=composeSemanticDepth(state.baseDepth,layers,{zero:Number($('zero').value),backgroundRelief:Number($('background').value)/100});if(state.preview==='depth')drawDepth();report()}
    function report(){const spread=cardDepthSpread(state.groups,Number($('zero').value));const masks=state.groups.filter(group=>maskCoverage(group.mask).percent>.005).length;$('report').textContent=`${state.groups.length} groupes · ${masks} masques actifs · amplitude ${spread.span}/255 · fond ${$('background').value}% · vue 05 verrouillée.`;$('report').className='status '+(spread.span>=100&&masks===state.groups.length?'ok':'warn')}

    function drawPhoto(){photoContext.clearRect(0,0,state.width,state.height);photoContext.drawImage(state.image,0,0,state.width,state.height)}
    function drawDepth(){if(!state.finalDepth)return;const image=photoContext.createImageData(state.width,state.height);for(let index=0;index<state.finalDepth.length;index++){const value=state.finalDepth[index];image.data[index*4]=image.data[index*4+1]=image.data[index*4+2]=value;image.data[index*4+3]=255}photoContext.putImageData(image,0,0);maskContext.clearRect(0,0,state.width,state.height)}
    function drawMaskOverlay(){maskContext.clearRect(0,0,state.width,state.height);if(state.preview!=='card')return;const group=selected();if(!group)return;const image=maskContext.createImageData(state.width,state.height);for(let index=0;index<group.mask.length;index++){const alpha=group.mask[index];if(alpha<5)continue;image.data[index*4]=0;image.data[index*4+1]=229;image.data[index*4+2]=255;image.data[index*4+3]=Math.round(alpha*.68)}maskContext.putImageData(image,0,0)}
    function showCard(){state.preview='card';drawPhoto();drawMaskOverlay();$('card').classList.add('active');$('depthView').classList.remove('active')}

    function renderGroups(){const root=$('groups');root.innerHTML='';state.groups.forEach(group=>{const element=document.createElement('div');element.className='group'+(group.id===state.selected?' selected':'');element.innerHTML=`<div class="grouphead"><b>${escapeHtml(group.label)}</b><button>Éditer</button></div><div class="small">${escapeHtml(group.role)} · ${group.items.length} composant(s) · masque ${maskCoverage(group.mask).percent.toFixed(2)}%</div><label>Profondeur <b class="value">${group.depth}</b><input type="range" min="0" max="255" value="${group.depth}"></label>`;element.querySelector('button').onclick=()=>{state.selected=group.id;state.history=[];renderGroups();showCard();updateUndo();$('pencilStatus').textContent=`Correction active sur « ${group.label} »`};element.querySelector('input').oninput=event=>{group.depth=Number(event.target.value);element.querySelector('.value').textContent=group.depth;compose()};root.appendChild(element)})}

    function applyPreset(){const preset=createCardDepthPreset(state.groups,$('preset').value);$('zero').value=preset.zero;$('relief').value=preset.reliefPercent;$('parallax').value=preset.parallaxPercent;state.groups.forEach((group,index)=>group.depth=preset.depths[index]);updateOutputs();renderGroups();compose()}
    function updateOutputs(){$('zeroOut').textContent=$('zero').value;$('reliefOut').textContent=$('relief').value+'%';$('parallaxOut').textContent=$('parallax').value+'%';$('backgroundOut').textContent=$('background').value+'%'}

    function canvasPoint(event){const rect=mask.getBoundingClientRect();return{x:(event.clientX-rect.left)/rect.width*state.width,y:(event.clientY-rect.top)/rect.height*state.height}}
    function directStroke(from,to){maskContext.save();maskContext.lineCap='round';maskContext.lineJoin='round';maskContext.lineWidth=Number($('brush').value)*2;maskContext.globalCompositeOperation=state.mode==='erase'?'destination-out':'source-over';maskContext.strokeStyle='rgba(0,229,255,.68)';maskContext.beginPath();maskContext.moveTo(from.x,from.y);maskContext.lineTo(to.x,to.y);maskContext.stroke();maskContext.restore()}
    mask.addEventListener('pointerdown',event=>{const group=selected();if(!group||state.preview!=='card')return;event.preventDefault();state.history.push(new Uint8ClampedArray(group.mask));if(state.history.length>20)state.history.shift();state.drawing=true;state.lastPoint=canvasPoint(event);mask.setPointerCapture?.(event.pointerId);updateUndo()},{passive:false});
    mask.addEventListener('pointermove',event=>{if(!state.drawing)return;event.preventDefault();const group=selected(),point=canvasPoint(event),value=state.mode==='erase'?0:255;paintMask(group.mask,state.width,state.height,state.lastPoint,point,Number($('brush').value),value);directStroke(state.lastPoint,point);state.lastPoint=point},{passive:false});
    function endStroke(){if(!state.drawing)return;state.drawing=false;drawMaskOverlay();compose();renderGroups()}
    mask.addEventListener('pointerup',endStroke);mask.addEventListener('pointercancel',endStroke);
    function updateUndo(){$('undo').disabled=!state.history.length}
    $('undo').onclick=()=>{const group=selected();const previous=state.history.pop();if(group&&previous){group.mask=previous;drawMaskOverlay();compose();renderGroups()}updateUndo()};
    $('resetMask').onclick=()=>{const group=selected();if(!group)return;state.history.push(new Uint8ClampedArray(group.mask));group.mask=new Uint8ClampedArray(group.autoMask);drawMaskOverlay();compose();renderGroups();updateUndo()};
    $('add').onclick=()=>{state.mode='add';$('add').classList.add('active');$('erase').classList.remove('active')};
    $('erase').onclick=()=>{state.mode='erase';$('erase').classList.add('active');$('add').classList.remove('active')};
    $('brush').oninput=()=>{$('brushOut').textContent=$('brush').value};
    $('card').onclick=showCard;$('depthView').onclick=()=>{state.preview='depth';drawDepth();$('depthView').classList.add('active');$('card').classList.remove('active')};

    function depthWorker(){if(state.worker)return state.worker;const worker=new Worker(new URL('./depthflow-v42-worker.js',import.meta.url),{type:'module'});worker.onmessage=event=>{const message=event.data||{};if(message.requestId!==state.requestId)return;if(message.type==='progress'){$('sourceInfo').textContent=message.stage;$('progress').style.width=message.percent+'%'}if(message.type==='result'){state.baseDepth=new Uint8ClampedArray(message.refinedBuffer);$('sourceInfo').className='status ok';$('sourceInfo').textContent='DepthFlow prêt. Le relief du fond reste volontairement limité pour protéger les textes.';$('progress').style.width='100%';compose()}if(message.type==='error'){$('sourceInfo').className='status warn';$('sourceInfo').textContent='DepthFlow indisponible : '+message.message+'\nLe rendu par plans sémantiques reste utilisable.'}};state.worker=worker;return worker}
    $('depthflow').onclick=()=>{state.requestId++;$('sourceInfo').className='status';$('sourceInfo').textContent='DepthFlow démarre sur l’iPad…';const guide=new Uint8ClampedArray(state.rgba);depthWorker().postMessage({type:'estimate-and-refine',requestId:state.requestId,payload:{imageUrl:state.payload.image,width:state.width,height:state.height,fullGuideBuffer:guide.buffer}},[guide.buffer])};

    async function generateViews(){
      compose();$('generate').disabled=true;$('generate').textContent='Calcul des 9 vues…';state.urls.forEach(URL.revokeObjectURL);state.views=[];state.blobs=[];state.urls=[];state.renderStats=[];
      const options={zero:Number($('zero').value),relief:Number($('relief').value)/100,stabilityBand:2,parallaxPercent:Number($('parallax').value),planeSeparation:2.35};
      for(let index=0;index<9;index++){await new Promise(requestAnimationFrame);const position=(index-4)/4;const rendered=renderNovelView(state.rgba,state.finalDepth,state.width,state.height,position,options);if(index===4)rendered.data.set(state.rgba);const canvas=document.createElement('canvas');canvas.width=state.width;canvas.height=state.height;canvas.getContext('2d').putImageData(new ImageData(rendered.data,state.width,state.height),0,0);const blob=await toBlob(canvas);state.views.push(canvas);state.blobs.push(blob);state.urls.push(URL.createObjectURL(blob));state.renderStats.push({view:index+1,position,holesBeforeFill:rendered.holesBeforeFill,filledPixels:rendered.filledPixels});$('generate').textContent=`Vue ${index+1}/9…`}
      const centre=state.views[4].getContext('2d').getImageData(0,0,state.width,state.height).data;const centreQc=comparePixels(centre,state.rgba);$('renderStatus').textContent=`QC vue 05 : ${centreQc.different===0?'copie pixel parfaite':'écart '+centreQc.different+' pixels'} · positions −1 à +1 · interpolation continue.`;$('views').innerHTML=state.urls.map((url,index)=>`<div class="view"><img src="${url}" alt="Vue ${index+1}"><span>${String(index+1).padStart(2,'0')}</span></div>`).join('');$('results').classList.remove('hidden');$('generate').disabled=false;$('generate').textContent='Régénérer les 9 vues';state.simPosition=4;$('simRange').value='4';drawSimulation(4);startAnimation()}
    $('generate').onclick=generateViews;

    function drawSimulation(position){if(!state.views.length)return;const canvas=$('sim'),context=canvas.getContext('2d');canvas.width=state.width;canvas.height=state.height;const p=Math.max(0,Math.min(8,position)),lo=Math.floor(p),hi=Math.min(8,lo+1),mix=p-lo;context.globalAlpha=1;context.drawImage(state.views[lo],0,0);if(hi!==lo&&mix>0){context.globalAlpha=mix;context.drawImage(state.views[hi],0,0);context.globalAlpha=1}$('simRange').value=String(p);$('simOut').textContent=`${(p+1).toFixed(2)} / 9`}
    function animationLoop(time){if(!state.playing)return;if(!state.lastTime)state.lastTime=time;const dt=Math.min(50,time-state.lastTime);state.lastTime=time;state.simPosition+=state.direction*dt/620;if(state.simPosition>=8){state.simPosition=8;state.direction=-1}if(state.simPosition<=0){state.simPosition=0;state.direction=1}drawSimulation(state.simPosition);state.animation=requestAnimationFrame(animationLoop)}
    function startAnimation(){cancelAnimationFrame(state.animation);state.playing=true;state.lastTime=0;$('toggle').textContent='Pause';state.animation=requestAnimationFrame(animationLoop)}
    function stopAnimation(){state.playing=false;cancelAnimationFrame(state.animation);$('toggle').textContent='Lecture'}
    $('toggle').onclick=()=>state.playing?stopAnimation():startAnimation();
    $('simRange').oninput=event=>{stopAnimation();state.simPosition=Number(event.target.value);drawSimulation(state.simPosition)};
    $('prev').onclick=()=>{stopAnimation();state.simPosition=Math.max(0,state.simPosition-1);drawSimulation(state.simPosition)};
    $('next').onclick=()=>{stopAnimation();state.simPosition=Math.min(8,state.simPosition+1);drawSimulation(state.simPosition)};

    async function maskBlob(group){const canvas=document.createElement('canvas');canvas.width=state.width;canvas.height=state.height;const context=canvas.getContext('2d'),image=context.createImageData(state.width,state.height);for(let index=0;index<group.mask.length;index++){const value=group.mask[index];image.data[index*4]=image.data[index*4+1]=image.data[index*4+2]=value;image.data[index*4+3]=255}context.putImageData(image,0,0);return toBlob(canvas)}
    $('zip').onclick=async()=>{if(!window.JSZip)return;$('zip').disabled=true;$('zip').textContent='ZIP…';const zip=new JSZip(),sourceResponse=await fetch(state.payload.image),sourceBlob=await sourceResponse.blob();zip.file('source-carte.png',sourceBlob);state.blobs.forEach((blob,index)=>zip.file(`vue-${String(index+1).padStart(2,'0')}.png`,blob));for(let index=0;index<state.groups.length;index++)zip.file(`masques/groupe-${String(index+1).padStart(2,'0')}.png`,await maskBlob(state.groups[index]));const depthCanvas=document.createElement('canvas');depthCanvas.width=state.width;depthCanvas.height=state.height;const depthContext=depthCanvas.getContext('2d'),depthImage=depthContext.createImageData(state.width,state.height);for(let index=0;index<state.finalDepth.length;index++){const value=state.finalDepth[index];depthImage.data[index*4]=depthImage.data[index*4+1]=depthImage.data[index*4+2]=value;depthImage.data[index*4+3]=255}depthContext.putImageData(depthImage,0,0);zip.file('depth-map.png',await toBlob(depthCanvas));const settings={zero:Number($('zero').value),relief:Number($('relief').value),parallax:Number($('parallax').value),backgroundRelief:Number($('background').value)};const groups=state.groups.map(({mask,autoMask,selected,...group},index)=>({...group,maskFile:`masques/groupe-${String(index+1).padStart(2,'0')}.png`}));zip.file('manifest.json',JSON.stringify({schema:'microplayer.card-v32',version:32,exportedAt:new Date().toISOString(),dimensions:{width:state.width,height:state.height},source:{rectified:true,capture:state.payload.capture||null,file:'source-carte.png'},pipeline:{stage:'ocr-layout-semantics-depthflow-v32',centerViewPixelPerfect:true},ocr:state.payload.ocrLines,ocrSummary:{engine:'tesseract-local',lineCount:state.payload.ocrLines?.length||0},groups,settings,render:{engine:'depthflow-v42',viewCount:9,depthMapFile:'depth-map.png',views:state.renderStats}},null,2));const blob=await zip.generateAsync({type:'blob'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='MicroPlayer-carte-V32-9-vues.zip';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),30000);$('zip').disabled=false;$('zip').textContent='ZIP complet'};

    $('back').onclick=()=>location.href='./microplayer-card-v32-scanner.html';$('auto').onclick=applyPreset;$('preset').onchange=applyPreset;
    for(const id of ['zero','relief','parallax','background'])$(id).oninput=()=>{updateOutputs();compose()};

    async function initialise(){const raw=sessionStorage.getItem('microplayer-card-v32');if(!raw){$('sourceInfo').className='status warn';$('sourceInfo').innerHTML='Aucune carte V32 transférée. <a href="./microplayer-card-v32-scanner.html" style="color:#9bd0ff">Ouvrir le scanner</a>.';$('generate').disabled=true;return}state.payload=JSON.parse(raw);state.image=await loadImage(state.payload.image);state.width=photo.width=mask.width=state.payload.width||state.image.naturalWidth;state.height=photo.height=mask.height=state.payload.height||state.image.naturalHeight;stage.style.aspectRatio=state.width+'/'+state.height;drawPhoto();state.rgba=photoContext.getImageData(0,0,state.width,state.height).data;state.baseDepth=new Uint8ClampedArray(state.width*state.height).fill(128);state.groups=(state.payload.groups||[]).map((group,index)=>{const full={...group,id:String(group.id||group.groupId||index),depth:Number(group.depth??128)};full.autoMask=semanticMaskForGroup(full);full.mask=new Uint8ClampedArray(full.autoMask);return full});state.selected=state.groups[0]?.id||null;$('sourceInfo').className='status ok';$('sourceInfo').textContent=`${state.payload.ocrLines?.length||0} lignes OCR verrouillées · ${state.payload.layers?.length||0} composants · ${state.groups.length} groupes.`;applyPreset();showCard();updateUndo()}
    initialise().catch(error=>{$('sourceInfo').className='status warn';$('sourceInfo').textContent='Erreur initialisation : '+error.message});
  </script>
</body>
</html>
