;object-fit:contain}.view span{position:absolute;left:5px;top:5px;background:#000b;padding:3px}.simnav{display:grid;grid-template-columns:46px 1fr 46px 90px;gap:8px}.hidden{display:none!important}@media(max-width:980px){.layout{grid-template-columns:1fr}.controls{grid-template-columns:1fr}}</style></head><body><header class="top"><b>MicroPlayer — Carte 3D Pro V31.2</b><span>plans rigides · sans déformation</span></header><main class="wrap"><div class="layout"><aside><section class="panel"><h2>1. Image validée</h2><input id="file" type="file" accept="image/*"><select id="quality"><option value="960">iPad rapide</option><option value="1280" selected>iPad qualité</option><option value="1536">Impression</option></select><div class="actions"><button id="analyze" disabled>Reconnaître</button><button id="depth" class="primary" disabled>DepthFlow</button></div><div id="status" class="status">Importez l’image recadrée.</div></section><section id="layersPanel" class="panel hidden"><h2>2. Plans sémantiques</h2><select id="preset"><option value="professional">Pro lisible</option><option value="artistic">Artistique</option></select><button id="applyPreset">Répartir automatiquement</button><div id="layers"></div></section></aside><section><section class="panel"><h2>Carte / profondeur</h2><div id="stage" class="stage"><canvas id="photoCanvas"></canvas><canvas id="maskCanvas"></canvas></div><div class="actions"><button id="showOriginal" class="active">Carte</button><button id="showDepth">Profondeur</button></div></section><section id="settingsPanel" class="panel hidden"><h2>3. Relief</h2><div class="controls"><label>Plan zéro <b id="zeroOut">128</b><input id="zero" type="range" min="0" max="255" value="128"></label><label>Relief <b id="reliefOut">190 %</b><input id="relief" type="range" min="80" max="240" value="190"></label><label>Parallaxe <b id="parallaxOut">2,8 %</b><input id="parallax" type="range" min="0" max="5" step=".1" value="2.8"></label></div><div id="effectReport" class="status"></div><button id="generate" class="primary" disabled>Générer les 9 vues</button></section><section id="resultPanel" class="panel hidden"><h2>4. Simulation lenticulaire</h2><div class="sim"><canvas id="simCanvas"></canvas></div><div class="simnav"><button id="prev">‹</button><input id="simRange" type="range" min="0" max="8" step=".01" value="4"><button id="next">›</button><output id="simOut">5,00 / 9</output></div><p class="small">Aperçu interpolé uniquement. Les 9 images ci-dessous restent les vues de production.</p><div id="views" class="views"></div><div class="actions"><button id="toggle">Pause</button><button id="download" class="green">ZIP</button></div></section></section></div></main><script type="module">import{cardDepthSpread,composeSemanticDepth,createBoxMask,createCardDepthPreset,createSemanticMask,maskCoverage}from'./business-card-depthflow-core.js';const $=id=>document.getElementById(id),pc=$('photoCanvas').getContext('2d',{willReadFrequently:true}),mc=$('maskCanvas').getContext('2d'),S={url:null,dataUrl:null,img:null,rgba:null,base:null,final:null,layers:[],sel:null,worker:null,rid:0,resolve:null,reject:null,blobs:[],urls:[],imgs:[],pos:4,play:false,raf:0,dir:1,last:0,preview:'original'};const status=(t,c='')=>{$('status').textContent=t;$('status').className='status '+c},read=f=>new Promise((r,j)=>{const q=new FileReader;q.onload=()=>r(q.result);q.onerror=j;q.readAsDataURL(f)}),load=u=>new Promise((r,j)=>{const i=new Image;i.onload=()=>r(i);i.onerror=j;i.src=u}),blob=c=>new Promise(r=>c.toBlob(r,'image/png'));function resize(i){const w=Math.min(+$('quality').value,i.naturalWidth),h=Math.round(w*i.naturalHeight/i.naturalWidth);for(const c of[$('photoCanvas'),$('maskCanvas')]){c.width=w;c.height=h}$('stage').style.aspectRatio=w+'/'+h;pc.drawImage(i,0,0,w,h);S.rgba=pc.getImageData(0,0,w,h).data}function autoMask(l){const m=createSemanticMask(S.rgba,$('photoCanvas').width,$('photoCanvas').height,l.bbox,{threshold:l.type==='text'?28:38,softness:2 se();draw();report();schedule()};root.appendChild(d)})}function applyPreset(gen=true){const p=createCardDepthPreset(S.layers,$('preset').value);$('zero').value=p.zero;$('relief').value=190;$('parallax').value=2.8;S.layers.forEach((l,i)=>{l.depth=p.depths[i];l.internalRelief=0});outputs();renderLayers();compose();draw();report();if(gen)schedule(true)}$('applyPreset').onclick=()=>applyPreset(true);function outputs(){$('zeroOut').textContent=$('zero').value;$('reliefOut').textContent=$('relief').value+' %';$('parallaxOut').textContent=(+$('parallax').value).toLocaleString('fr-FR')+' %'}function worker(){if(S.worker)return S.worker;const w=new Worker(new URL('./depthflow-v42-worker.js',import.meta.url),{type:'module'});w.onmessage=e=>{const m=e.data||{};if(m.requestId!==S.rid)return;if(m.type==='result'){S.resolve?.(new Uint8ClampedArray(m.refinedBuffer));S.resolve=S.reject=null}if(m.type==='error'){S.reject?.(Error(m.message));S.resolve=S.reject=null}};S.worker=w;return w}function runDepth(){const g=new Uint8ClampedArray(S.rgba),id=++S.rid;return new Promise((r,j)=>{S.resolve=r;S.reject=j;worker().postMessage({type:'estimate-and-refine',requestId:id,payload:{imageUrl:S.url,width:$('photoCanvas').width,height:$('photoCanvas').height,fullGuideBuffer:g.buffer}},[g.buffer])})}$('depth').onclick=async()=>{try{status('DepthFlow analyse le fond…','warn');S.base=await runDepth();compose();$('settingsPanel').classList.remove('hidden');$('generate').disabled=false;draw();report();status('Profondeur prête.','ok');schedule(true)}catch(e){status(e.message)}};function compose(){if(!S.base)return;S.final=composeSemanticDepth(S.base,S.layers,{zero:+$('zero').value,backgroundRelief:.06})}function draw(){mc.clearRect(0,0,mc.canvas.width,mc.canvas.height);if(S.preview==='depth'&&S.final){const im=mc.createImageData(mc.canvas.width,mc.canvas.height);for(let i=0,j=0;i<S.final.length;i++,j+=4){im.data[j]=im.data[j+1]=im.data[j+2]=S.final[i];im.data[j+3]=220}mc.putImageData(im,0,0)}const l=S.layers.find(x=>x.id===S.sel);if(l?.mask){const im=mc.getImageData(0,0,mc.canvas.width,mc.canvas.height);for(let i=0,j=0;i<l.mask.length;i++,j+=4)if(l.mask[i]>40){im.data[j+1]=220;im.data[j+2]=255;im.data[j+3]=150}mc.putImageData(im,0,0)}}$('showOriginal').onclick=()=>{S.preview='original';draw()};$('showDepth').onclick=()=>{S.preview='depth';draw()};function report(){const s=cardDepthSpread(S.layers,+$('zero').value);$('effectReport').textContent=`Amplitude ${s.span}/255 · rendu par plans rigides · fond stabilisé`}['zero','relief','parallax'].forEach(id=>$(id).oninput=()=>{outputs();compose();draw();report();schedule()});let timer;function schedule(now=false){if(!S.final)return;clearTimeout(timer);timer=setTimeout(generate,now?0:450)}$('generate').onclick=generate;function shiftFor(depth,pos){const z=+$('zero').value,rel=+$('relief').value/100,par=+$('parallax').value/100,normalized=(depth-z)/(depth>=z?Math.max(1,255-z):Math.max(1,z));return -pos*normalized*rel*par*$('photoCanvas').width*.5}function renderRigid(pos){const w=$('photoCanvas').width,h=$('photoCanvas').height,c=document.createElement('canvas'),x=c.getContext('2d');c.width=w;c.height=h;x.drawImage($('photoCanvas'),0,0);const groups=new Map;for(const l of S.layers){if(!l.enabled)continue;const key=l.groupId||l.id;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(l)}const ordered=[...groups.values()].sort((a,b)=>(a[0].depth||128)-(b[0].depth||128));for(const group of ordered){const depth=group[0].depth||128,dx=shiftFor(depth,pos);if(Math.abs(dx)<.05)continue;const layer=document.createElement('canvas'),lx=layer.getContext('2d');layer.width=w;layer.height=h;const image=lx.createImageData(w,h);for(const l of group)for(let i=0,j=0;i<l.mask.length;i++,j+=4){const a=l.mask[i]/255;if(a<=.08)continue;image.data[j]=S.rgba[j];image.data[j+1]=S.rgba[j+1];image.data[j+2]=S.rgba[j+2];image.data[j+3]=Math.round(a*255)}lx.putImageData(image,0,0);x.clearRect(dx<0?w+dx:0,0,Math.ceil(Math.abs(dx))+2,h);x.drawImage(layer,dx,0)}return c}function clear(){stop();S.urls.forEach(URL.revokeObjectURL);S.urls=[];S.blobs=[];S.imgs=[];$('views').innerHTML=''}async function generate(){if(!S.final)return;clear();$('generate').disabled=true;for(let i=0;i<9;i++){const c=renderRigid((i-4)/4),b=await blob(c);S.blobs.push(b);S.urls.push(URL.createObjectURL(b));await new Promise(requestAnimationFrame)}renderResults();$('resultPanel').classList.remove('hidden');$('generate').disabled=false;status('9 vues rigides générées sans warping.','ok')}function stop(){S.play=false;if(S.raf)cancelAnimationFrame(S.raf);S.raf=0}function drawSim(p){if(S.imgs.length!==9)return;p=Math.max(0,Math.min(8,p));const lo=Math.floor(p),hi=Math.min(8,lo+1),m=p-lo,c=$('simCanvas'),x=c.getContext('2d');if(c.width!==pc.canvas.width||c.height!==pc.canvas.height){c.width=pc.canvas.width;c.height=pc.canvas.height}x.globalAlpha=1;x.drawImage(S.imgs[lo],0,0,c.width,c.height);if(hi!==lo&&m){x.globalAlpha=m;x.drawImage(S.imgs[hi],0,0,c.width,c.height);x.globalAlpha=1}S.pos=p;$('simRange').value=p;$('simOut').textContent=(p+1).toFixed(2).replace('.',',')+' / 9'}function loop(t){if(!S.play)return;if(!S.last)S.last=t;const dt=Math.min(34,t-S.last);S.last=t;S.pos+=S.dir*dt/900;if(S.pos>=8){S.pos=8;S.dir=-1}else if(S.pos<=0){S.pos=0;S.dir=1}drawSim(S.pos);S.raf=requestAnimationFrame(loop)}function start(){stop();S.play=true;S.last=0;$('toggle').textContent='Pause';S.raf=requestAnimationFrame(loop)}function renderResults(){S.urls.forEach((u,i)=>{const d=document.createElement('div');d.className='view';d.innerHTML=`<img src="${u}"><span>${i+1}</span>`;$('views').appendChild(d)});Promise.all(S.urls.map(load)).then(a=>{S.imgs=a;drawSim(4);start()})}$('toggle').onclick=()=>S.play?(stop(),$('toggle').textContent='Reprendre'):start();$('simRange').oninput=e=>{stop();drawSim(+e.target.value)};$('prev').onclick=()=>{stop();drawSim(Math.max(0,S.pos-1))};$('next').onclick=()=>{stop();drawSim(Math.min(8,S.pos+1))};$('download').onclick=async()=>{const z=new JSZip;S.blobs.forEach((b,i)=>z.file(`vue-${String(i+1).padStart(2,'0')}.png`,b));const b=await z.generateAsync({type:'blob'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='microplayer-v31-rigide.zip';a.click()};outputs()</script></body></html>
