entDefault();const l=sel(),events=e.getCoalescedEvents?.()||[e],x=mc;for(const ev of events){const p=point(ev),target=S.mode==='add'?l.add:l.erase,other=S.mode==='add'?l.erase:l.add;paintMask(target,mask.width,mask.height,last,p,+$('brush').value,255);paintMask(other,mask.width,mask.height,last,p,+$('brush').value,0);x.strokeStyle=S.mode==='add'?'#00e5ff':'#ff5252';x.lineWidth=+$('brush').value*2;x.lineCap='round';x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p;count++}};function finish(e){if(!painting)return;e.preventDefault();painting=false;const l=sel();rebuild(l);if(S.mode==='add')exclusive(l);S.bg=null;compose();renderLayers();draw();$('pstate').textContent=`✓ ${count} points enregistrés sur « ${l.label} »`;schedule()}mask.onpointerup=finish;mask.onpointercancel=finish;function outputs(){$('brushOut').textContent=$('brush').value;$('zout').textContent=$('zero').value;$('rout').textContent=$('relief').value+'%';$('pout').textContent=(+$('parallax').value).toLocaleString('fr-FR')+'%'}function report(){const s=cardDepthSpread(S.layers,+$('zero').value);$('report').textContent=`Amplitude ${s.span}/255 · fond reconstruit · masques exclusifs`}['zero','relief','parallax'].forEach(id=>$(id).oninput=()=>{outputs();compose();report();schedule()});let timer;function schedule(now=false){if(!S.final)return;clearTimeout(timer);timer=setTimeout(generate,now?0:600)}$('generate').onclick=generate;function buildBackground(){if(S.bg)return S.bg;const w=photo.width,h=photo.height,n=w*h,blocked=new Uint8Array(n),dist=new Int32Array(n),src=new Int32Array(n),q=new Int32Array(n);dist.fill(-1);for(const l of S.layers)for(let i=0;i<n;i++)if(l.mask[i]>50)blocked[i]=1;let head=0,tail=0;for(let i=0;i<n;i++)if(!blocked[i]){dist[i]=0;src[i]=i;q[tail++]=i}const dirs=[-1,1,-w,w];while(head<tail){const i=q[head++],x=i%w;for(const d of dirs){const j=i+d;if(j<0||j>=n||(d===-1&&x===0)||(d===1&&x===w-1)||dist[j]>=0)continue;dist[j]=dist[i]+1;src[j]=src[i];q[tail++]=j}}const out=new Uint8ClampedArray(S.rgba);for(let i=0;i<n;i++)if(blocked[i]){const s=src[i],a=i*4,b=s*4;out[a]=S.rgba[b];out[a+1]=S.rgba[b+1];out[a+2]=S.rgba[b+2];out[a+3]=255}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').putImageData(new ImageData(out,w,h),0,0);return S.bg=c}function shift(depth,pos){const z=+$('zero').value,n=(depth-z)/(depth>=z?Math.max(1,255-z):Math.max(1,z));return-pos*n*(+$('relief').value/100)*(+$('parallax').value/100)*photo.width*.42}function render(pos){const w=photo.width,h=photo.height,c=document.createElement('canvas'),x=c.getContext('2d');c.width=w;c.height=h;x.drawImage(buildBackground(),0,0);const groups=new Map;for(const l of S.layers){const k=l.groupId||l.id;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(l)}for(const g of[...groups.values()].sort((a,b)=>a[0].depth-b[0].depth)){const layer=document.createElement('canvas'),lx=layer.getContext('2d');layer.width=w;layer.height=h;const im=lx.createImageData(w,h);for(const l of g)for(let i=0,j=0;i<l.mask.length;i++,j+=4)if(l.mask[i]>30){const a=l.mask[i]/255;im.data[j]=S.rgba[j];im.data[j+1]=S.rgba[j+1];im.data[j+2]=S.rgba[j+2];im.data[j+3]=Math.round(255*a)}lx.putImageData(im,0,0);x.drawImage(layer,shift(g[0].depth,pos),0)}return c}function clear(){stop();S.urls.forEach(URL.revokeObjectURL);S.urls=[];S.blobs=[];S.imgs=[];$('views').innerHTML=''}async function generate(){if(!S.final)return;clear();$('generate').disabled=true;stat('Reconstruction du fond puis 9 vues…','warn');for(let i=0;i<9;i++){const c=render((i-4)/4),b=await toBlob(c);S.blobs.push(b);S.urls.push(URL.createObjectURL(b));await new Promise(requestAnimationFrame)}renderResults();$('results').classList.remove('hidden');$('generate').disabled=false;stat('9 vues sans copie fantôme générées.','ok')}function stop(){S.play=false;if(S.raf)cancelAnimationFrame(S.raf);S.raf=0}function sim(p){if(S.imgs.length!==9)return;p=Math.max(0,Math.min(8,p));const lo=Math.floor(p),hi=Math.min(8,lo+1),m=p-lo,c=$('sim'),x=c.getContext('2d');if(c.width!==photo.width||c.height!==photo.height){c.width=photo.width;c.height=photo.height}x.globalAlpha=1;x.drawImage(S.imgs[lo],0,0,c.width,c.height);if(hi!==lo&&m){x.globalAlpha=m;x.drawImage(S.imgs[hi],0,0,c.width,c.height);x.globalAlpha=1}S.pos=p;$('range').value=p;$('out').textContent=(p+1).toFixed(2).replace('.',',')+' / 9'}function loop(t){if(!S.play)return;if(!S.last)S.last=t;const dt=Math.min(34,t-S.last);S.last=t;S.pos+=S.dir*dt/1100;if(S.pos>=8){S.pos=8;S.dir=-1}else if(S.pos<=0){S.pos=0;S.dir=1}sim(S.pos);S.raf=requestAnimationFrame(loop)}function start(){stop();S.play=true;S.last=0;S.raf=requestAnimationFrame(loop)}function renderResults(){S.urls.forEach((u,i)=>{const d=document.createElement('div');d.className='view';d.innerHTML=`<img src="${u}"><span>${i+1}</span>`;$('views').appendChild(d)});Promise.all(S.urls.map(load)).then(a=>{S.imgs=a;sim(4);start()})}$('toggle').onclick=()=>S.play?stop():start();$('range').oninput=e=>{stop();sim(+e.target.value)};$('prev').onclick=()=>{stop();sim(S.pos-1)};$('next').onclick=()=>{stop();sim(S.pos+1)};$('zip').onclick=async()=>{const z=new JSZip;S.blobs.forEach((b,i)=>z.file(`vue-${String(i+1).padStart(2,'0')}.png`,b));const b=await z.generateAsync({type:'blob'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='microplayer-v31-4.zip';a.click()};outputs()</script></body></html>
