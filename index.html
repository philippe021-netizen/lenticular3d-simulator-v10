function resetStudioHorizontalFrame(){
  // Safari may retain a horizontal offset when switching embedded studios.
  // Never alter the navigation tab strip's own scroll position.
  try{
    document.documentElement.scrollLeft=0;
    document.body.scrollLeft=0;
    const stage=$('serviceFrame')?.parentElement;
    if(stage)stage.scrollLeft=0;
    window.scrollTo(0,window.scrollY);
  }catch(_){}
}
function activate(id,force=false){const found=routeById(id),r=found.route;activeFamily=found.family.id;activeRoute=r.id;drawFamilies();drawSubnav(found.family);$('routeTitle').textContent=r.title;$('routeHelp').textContent=r.help;sessionStorage.setItem('happyholo:hub-route',r.id);const absolute=new URL(r.src,location.href).href;resetStudioHorizontalFrame();if(force||loadedSrc!==absolute){loading.hidden=false;loading.firstElementChild.textContent='Ouverture du module…';loadedSrc=absolute;frame.src=r.src}else{tuneEmbedded();scrollInside(r.target)}}
frame.addEventListener('load',()=>{loading.hidden=true;tuneEmbedded();resetStudioHorizontalFrame();scrollInside(routeById(activeRoute).route.target)});frame.addEventListener('error',()=>{loading.hidden=false;loading.firstElementChild.textContent='Le module ne répond pas. Utilise ↻ pour réessayer.'});
$('reload').onclick=()=>activate(activeRoute,true);$('open').onclick=()=>window.open(routeById(activeRoute).route.src,'_blank','noopener');$('focus').onclick=()=>document.body.classList.add('focus');$('focusExit').onclick=()=>document.body.classList.remove('focus');document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('focus')});
