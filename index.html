<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1118">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<title>HappyHolo — Tous les studios</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#f4f7fa;background:#071019;--ink:#071019;--panel:#101c27;--line:#263746;--muted:#9aabba;--blue:#38bdf8;--yellow:#ffd60a;--green:#35d07f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink)}button,a{font:inherit}button{touch-action:manipulation}.app{height:100dvh;display:grid;grid-template-columns:248px minmax(0,1fr);padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));gap:10px}.rail{min-height:0;background:linear-gradient(180deg,#111f2b,#0b151e);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 16px 50px #0007}.brand{padding:18px 16px 14px;border-bottom:1px solid var(--line)}.brand-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.brand strong{font-size:22px;letter-spacing:-.03em}.version{font-size:11px;font-weight:900;background:var(--yellow);color:#161b20;padding:5px 8px;border-radius:999px}.tagline{color:var(--muted);font-size:13px;line-height:1.35;margin-top:5px}.families{padding:10px;overflow:auto;-webkit-overflow-scrolling:touch}.family{width:100%;min-height:52px;border:0;border-radius:14px;padding:10px 11px;margin:3px 0;color:#c6d1da;background:transparent;display:grid;grid-template-columns:34px 1fr;align-items:center;text-align:left;font-weight:850}.family .ico{font-size:21px;text-align:center}.family small{display:block;font-size:11px;font-weight:650;color:#748696;margin-top:2px}.family.active{background:#eaf7ff;color:#071019;box-shadow:0 5px 20px #0004}.family.active small{color:#47677a}.rail-foot{margin-top:auto;padding:10px;border-top:1px solid var(--line)}.health{display:flex;align-items:center;gap:8px;padding:10px 11px;border-radius:12px;background:#0a151e;color:#b9c8d3;font-size:12px}.dot{width:9px;height:9px;border-radius:50%;background:#83909a;box-shadow:0 0 0 3px #83909a22}.dot.ok{background:var(--green);box-shadow:0 0 0 3px #35d07f22}.dot.warn{background:var(--yellow);box-shadow:0 0 0 3px #ffd60a22}.workspace{min-width:0;min-height:0;background:#f2f4f5;color:#10151a;border-radius:22px;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr);box-shadow:0 20px 60px #0008}.toolbar{background:#fff;border-bottom:1px solid #d8dee3;padding:10px 12px}.toolbar-top{display:flex;align-items:center;gap:10px}.title{min-width:0;flex:1}.title h1{font-size:20px;line-height:1.15;margin:0;letter-spacing:-.02em}.title p{font-size:12px;color:#5d6b76;margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tool-actions{display:flex;gap:7px}.icon-btn{width:46px;height:46px;border:1px solid #cbd3d9;border-radius:13px;background:#f7f9fa;color:#17212a;font-size:20px;font-weight:900}.subnav{display:flex;gap:7px;margin-top:9px;overflow-x:auto;padding-bottom:1px;scrollbar-width:none}.subnav::-webkit-scrollbar{display:none}.subtab{white-space:nowrap;min-height:44px;border:1px solid #cbd3d9;border-radius:12px;background:#f4f6f7;color:#34434f;padding:9px 13px;font-size:13px;font-weight:850}.subtab.active{background:#071019;border-color:#071019;color:#fff}.stage{position:relative;min-width:0;min-height:0;background:#dce2e6}.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:3;background:#e9edf0;color:#32434f;font-weight:850}.loading[hidden]{display:none}.loading div{background:#fff;border:1px solid #ccd5dc;border-radius:16px;padding:16px 20px;box-shadow:0 10px 30px #0002}.service-frame{width:100%;height:100%;border:0;display:block;background:#f4f4f2}.focus .app{grid-template-columns:1fr;padding:0;gap:0}.focus .rail,.focus .toolbar{display:none}.focus .workspace{border-radius:0}.focus-exit{display:none;position:fixed;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));z-index:1000;width:52px;height:52px;border:2px solid #fff;border-radius:15px;background:#071019dd;color:#fff;font-size:22px;box-shadow:0 5px 24px #0008}.focus .focus-exit{display:block}@media(max-width:820px),(orientation:portrait){.app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;padding:max(6px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));gap:6px}.workspace{grid-row:1;border-radius:17px}.rail{grid-row:2;border-radius:17px;min-height:72px}.brand,.rail-foot{display:none}.families{display:flex;gap:5px;padding:6px;overflow-x:auto}.family{flex:1 0 70px;min-width:70px;min-height:60px;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:6px 5px;margin:0;gap:1px}.family .ico{font-size:20px}.family span:last-child{font-size:11px}.family small{display:none}.toolbar{padding:8px}.title h1{font-size:17px}.title p{display:none}.icon-btn{width:44px;height:44px}.subnav{margin-top:7px}.subtab{min-height:42px;padding:8px 11px;font-size:12px}}@media(max-width:560px){.tool-actions .reload{display:none}.family{min-width:64px}.title h1{font-size:16px}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Familles HappyHolo">
    <div class="brand"><div class="brand-row"><strong>HappyHolo</strong><span class="version">V4</span></div><div class="tagline">Un seul accès pour créer, animer, produire et contrôler.</div></div>
    <nav class="families" id="families"></nav>
    <div class="rail-foot"><div class="health"><span class="dot" id="healthDot"></span><span id="healthText">Contrôle des services…</span></div></div>
  </aside>
  <main class="workspace">
    <header class="toolbar">
      <div class="toolbar-top">
        <div class="title"><h1 id="routeTitle">Studio 3D</h1><p id="routeHelp">Photo, relief et 9 vues lenticulaires</p></div>
        <div class="tool-actions"><button class="icon-btn reload" id="reload" title="Recharger ce module" aria-label="Recharger ce module">↻</button><button class="icon-btn" id="open" title="Ouvrir ce module seul" aria-label="Ouvrir ce module seul">↗</button><button class="icon-btn" id="focus" title="Plein écran" aria-label="Plein écran">⛶</button></div>
      </div>
      <nav class="subnav" id="subnav" aria-label="Outils de la famille"></nav>
    </header>
    <section class="stage"><div class="loading" id="loading"><div>Ouverture du module…</div></div><iframe class="service-frame" id="serviceFrame" title="Module HappyHolo" allow="clipboard-read; clipboard-write"></iframe></section>
  </main>
</div>
<button class="focus-exit" id="focusExit" aria-label="Quitter le plein écran">×</button>
<script>
(()=>{
  const families=[
    {id:'create',icon:'✦',label:'Créer',hint:'Photo & détourage',routes:[
      {id:'photo',label:'Photo & relief',title:'Photo & relief 3D',help:'Détourage local, profondeur et export de 9 vues',src:'./relief3d-test-v31.html?embed=1&v=401',target:'.card.grid'},
      {id:'cutout',label:'Détourage & fonds',title:'Détourage, fonds et composition',help:'Plusieurs zones au doigt ou Apple Pencil, fond reconstruit et placement libre',src:'./relief3d-test-v31.html?embed=1&v=401',target:'#happyHoloCustomBackgrounds'},
      {id:'analysis',label:'Analyser un visuel',title:'Analyse du visuel',help:'Résolution, netteté, contraste et cadrage support',src:'./happyholo-analysis.html?v=400'}]},
    {id:'animate',icon:'▶',label:'Animer',hint:'Local & PixVerse',routes:[
      {id:'local-actions',label:'Actions locales',title:'Actions locales',help:'Personne, animal, véhicule, objet et logo',src:'./relief3d-test-v31.html?embed=1&v=401',target:'#happyHoloSelectionControls'},
      {id:'pixverse',label:'Actions PixVerse',title:'Actions PixVerse V6',help:'Individu, couple, groupe, animal et logo en 2 s',src:'./happyholo-pixverse-actions-test.html?v=404'}]},
    {id:'products',icon:'▣',label:'Produits',hint:'Supports & cartes',routes:[
      {id:'supports',label:'Supports',title:'Supports et cadrage',help:'Porte-clé, médaillon, carte et verso',src:'./relief3d-test-v31.html?embed=1&v=401',target:'.support-card'},
      {id:'card',label:'Carte / souvenir',title:'Carte de visite et photo souvenir',help:'Analyse IA, texte protégé, 9 vues et ZIP impression',src:'./happyholo-business-card-studio.html?v=400'},
      {id:'simulator',label:'Simulateur 9 vues',title:'Simulateur lenticulaire universel',help:'Lecture fluide, tactile et contrôle des écarts',src:'./happyholo-simulator.html?v=400'}]},
    {id:'machines',icon:'⚙',label:'Machines',hint:'ExplodeView',routes:[
      {id:'explode',label:'Créer ExplodeView',title:'ExplodeView — machines',help:'Démontage progressif des grosses pièces seulement',src:'./relief3d-test-v31.html?embed=1&v=401',target:'#pieceSelectionStart'},
      {id:'explode-demo',label:'Démo Rocket 9 vues',title:'ExplodeView — démonstration',help:'Simulation fluide de la Rocket en 9 étapes cumulatives',src:'./explodeview-rocket-demo/index.html?v=400'}]},
    {id:'control',icon:'✓',label:'Contrôler',hint:'Qualité & services',routes:[
      {id:'quality',label:'Qualité des 9 vues',title:'Contrôle des 9 vues',help:'Doublons, sauts, fluidité et support final',src:'./happyholo-simulator.html?mode=analysis&v=400'},
      {id:'services',label:'État des services',title:'État des services HappyHolo',help:'IA, PixVerse, ExplodeView et fonctionnement hors ligne',src:'./happyholo-analysis.html?mode=services&v=400'}]}
  ];
  const $=id=>document.getElementById(id),frame=$('serviceFrame'),loading=$('loading');let activeFamily='create',activeRoute='photo',loadedSrc='';
  function routeById(id){for(const f of families){const r=f.routes.find(x=>x.id===id);if(r)return{family:f,route:r}}return{family:families[0],route:families[0].routes[0]}}
  function drawFamilies(){$('families').innerHTML=families.map(f=>`<button class="family${f.id===activeFamily?' active':''}" data-family="${f.id}"><span class="ico">${f.icon}</span><span>${f.label}<small>${f.hint}</small></span></button>`).join('');document.querySelectorAll('[data-family]').forEach(b=>b.onclick=()=>{const f=families.find(x=>x.id===b.dataset.family);activate(f.routes[0].id)})}
  function drawSubnav(f){$('subnav').innerHTML=f.routes.map(r=>`<button class="subtab${r.id===activeRoute?' active':''}" data-route="${r.id}">${r.label}</button>`).join('');document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>activate(b.dataset.route))}
  function scrollInside(selector){if(!selector)return;let tries=0;const run=()=>{tries++;try{const d=frame.contentDocument;const el=d?.querySelector(selector);if(el){el.scrollIntoView({block:'start',behavior:tries===1?'smooth':'auto'});return}if(tries<18)setTimeout(run,220)}catch(_){}};run()}
  function tuneEmbedded(){try{const d=frame.contentDocument;if(!d||!frame.src.includes('relief3d-test'))return;d.documentElement.classList.add('hh-embedded');let style=d.getElementById('happyHoloHubIpadStyle');if(!style){style=d.createElement('style');style.id='happyHoloHubIpadStyle';style.textContent='html.hh-embedded body{font-size:16px}.hh-embedded .wrap{max-width:none;padding:12px}.hh-embedded h1,.hh-embedded .sub{display:none}.hh-embedded #networkModeBanner{position:relative;font-size:13px;margin-bottom:10px;padding:9px}.hh-embedded #offlinePackCard{margin-bottom:10px}.hh-embedded button,.hh-embedded select,.hh-embedded input[type=file]{min-height:44px}.hh-embedded canvas{max-height:68dvh;object-fit:contain}.hh-embedded .support-stage{min-height:min(520px,60dvh)}@media(max-width:820px){.hh-embedded .wrap{padding:8px}.hh-embedded #hhStaticMaskButton{top:auto!important;bottom:68px!important;right:10px!important}.hh-embedded #buildMarker{bottom:6px!important}.hh-embedded .grid,.hh-embedded .support-grid{grid-template-columns:1fr!important}}';d.head.appendChild(style)}}catch(_){}}
  function activate(id,force=false){const found=routeById(id),r=found.route;activeFamily=found.family.id;activeRoute=r.id;drawFamilies();drawSubnav(found.family);$('routeTitle').textContent=r.title;$('routeHelp').textContent=r.help;sessionStorage.setItem('happyholo:hub-route',r.id);const absolute=new URL(r.src,location.href).href;if(force||loadedSrc!==absolute){loading.hidden=false;loading.firstElementChild.textContent='Ouverture du module…';loadedSrc=absolute;frame.src=r.src}else{tuneEmbedded();scrollInside(r.target)}}
  frame.addEventListener('load',()=>{loading.hidden=true;tuneEmbedded();scrollInside(routeById(activeRoute).route.target)});frame.addEventListener('error',()=>{loading.hidden=false;loading.firstElementChild.textContent='Le module ne répond pas. Utilise ↻ pour réessayer.'});
  $('reload').onclick=()=>activate(activeRoute,true);$('open').onclick=()=>window.open(routeById(activeRoute).route.src,'_blank','noopener');$('focus').onclick=()=>document.body.classList.add('focus');$('focusExit').onclick=()=>document.body.classList.remove('focus');document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('focus')});
  async function health(){try{const r=await fetch('./api/happyholo-health',{cache:'no-store'}),d=await r.json();const ready=[d.services?.pixverse,d.services?.analysis,d.services?.explodeview].filter(Boolean).length;$('healthDot').className='dot '+(ready===3?'ok':'warn');$('healthText').textContent=ready===3?'Tous les services connectés':`${ready}/3 services IA connectés`;}catch(_){$('healthDot').className='dot warn';$('healthText').textContent='Fonctions locales disponibles'}}
  const initial=sessionStorage.getItem('happyholo:hub-route')||location.hash.slice(1)||'photo';activate(initial);health();
})();
</script>
</body>
</html>
