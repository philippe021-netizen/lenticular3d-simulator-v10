<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HappyHolo — Tiefling V16</title><style>html,body{margin:0;width:100%;height:100%;background:#0d1117}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="app" title="HappyHolo Tiefling V16"></iframe><script>

const newControls=`<h2>2. Calcul SUJET</h2><div class="hint">Le sujet détouré possède sa propre profondeur et ses propres réglages.</div><div class="row"><label>Définition profondeur sujet</label><span id="subjectDepthSizeVal" class="val">518</span></div><input id="subjectDepthSize" type="range" min="322" max="798" step="28" value="518"><div class="row"><label>Déplacement sujet</label><span id="subjectMoveVal" class="val">60%</span></div><input id="subjectMove" type="range" min="0" max="130" value="60"><div class="row"><label>Pivot sujet</label><span id="subjectPivotVal" class="val">82%</span></div><input id="subjectPivot" type="range" min="0" max="120" value="82"><div class="row"><label>Volume sujet</label><span id="subjectVolumeVal" class="val">18%</span></div><input id="subjectVolume" type="range" min="0" max="40" value="18"><div class="btns"><button id="calcSubject">Recalculer le sujet</button></div><div class="sep"></div><h2>3. Calcul FOND</h2><div class="hint">Le décor et le sol sont calculés séparément du sujet.</div><label>Fond différent (optionnel)</label><input id="customBgFile" type="file" accept="image/*"><div class="row"><label>Définition profondeur fond</label><span id="bgDepthSizeVal" class="val">518</span></div><input id="bgDepthSize" type="range" min="322" max="798" step="28" value="518"><div class="row"><label>Contraste fond</label><span id="bgContrastVal" class="val">155%</span></div><input id="bgContrast" type="range" min="80" max="260" value="155"><div class="row"><label>Relief fond</label><span id="bgStrengthVal" class="val">68%</span></div><input id="bgStrength" type="range" min="0" max="120" value="68"><div class="row"><label>Translation fond</label><span id="bgDriftVal" class="val">22%</span></div><input id="bgDrift" type="range" min="0" max="100" value="22"><div class="row"><label>Protection sol / route</label><span id="bgGroundLockVal" class="val">96%</span></div><input id="bgGroundLock" type="range" min="60" max="100" value="96"><div class="btns"><button id="calcBg">Recalculer le fond</button><button id="editBgZones">Zones du fond — doigt / Pencil</button></div><div class="row"><label>Profondeur des zones sélectionnées</label><span id="bgZoneBiasVal" class="val">0</span></div><input id="bgZoneBias" type="range" min="-100" max="100" value="0"><div class="hint">Valeur positive = zone plus proche ; négative = zone plus lointaine.</div><div class="sep"></div><h2>4. Séquence</h2><div class="row"><label>Amplitude 9 vues</label><span id="parallaxVal" class="val">22 px</span></div><input id="parallax" type="range" min="4" max="70" value="22">`;
h=h.replace(oldControls,newControls);
h=h.replace(`[['depthSize',v=>v],['bgContrast',v=>v+'%'],['subjectMove',v=>v+'%'],['subjectPivot',v=>v+'%'],['subjectVolume',v=>v+'%'],['bgStrength',v=>v+'%'],['bgDrift',v=>v+'%'],['parallax',v=>v+' px']]`,`[['subjectDepthSize',v=>v],['bgDepthSize',v=>v],['bgContrast',v=>v+'%'],['subjectMove',v=>v+'%'],['subjectPivot',v=>v+'%'],['subjectVolume',v=>v+'%'],['bgStrength',v=>v+'%'],['bgDrift',v=>v+'%'],['bgGroundLock',v=>v+'%'],['bgZoneBias',v=>v],['parallax',v=>v+' px']]`);
h=h.replace(`let original,subject,bg,sDepth,bDepth,frames=[],pending,playing=false,timer,groundInfo=null;`,`let original,subject,bg,sDepth,bDepth,frames=[],pending,playing=false,timer,groundInfo=null,bgZoneMask=null,bgZoneBaseDepth=null;`);
h=h.replace(`shift=mix(depthShift,gshift,gb*.96)`,`shift=mix(depthShift,gshift,gb*(+$('bgGroundLock').value/100))`);
h=h.replace(`const z=sample(bDepth.data,bDepth.width,bDepth.height,sx0/(sw-1)*(bDepth.width-1),sy/(sh-1)*(bDepth.height-1),0)/255,pz=(z-.5),`,`let z=sample(bDepth.data,bDepth.width,bDepth.height,sx0/(sw-1)*(bDepth.width-1),sy/(sh-1)*(bDepth.height-1),0)/255;if(bgZoneMask){const zm=sample(bgZoneMask.data,bgZoneMask.width,bgZoneMask.height,sx0/(sw-1)*(bgZoneMask.width-1),sy/(sh-1)*(bgZoneMask.height-1),3)/255;z=Math.max(0,Math.min(1,z+zm*(+$('bgZoneBias').value/100)*.35));}const pz=(z-.5),`);
h=h.replace(`const size=+$('depthSize').value;stat('Tiefling : analyse du sujet…');sDepth=depthImage(await infer(subject,size,true),subject,$('sd'));stat('Tiefling : analyse du fond…');bDepth=normalize(depthImage(await infer(bg,size,false),bg,$('bd')),+$('bgContrast').value);`,`const ss=+$('subjectDepthSize').value,bs=+$('bgDepthSize').value;stat('Tiefling : analyse du sujet…');sDepth=depthImage(await infer(subject,ss,true),subject,$('sd'));stat('Tiefling : analyse du fond…');bDepth=normalize(depthImage(await infer(bg,bs,false),bg,$('bd')),+$('bgContrast').value);bgZoneBaseDepth=new ImageData(new Uint8ClampedArray(bDepth.data),bDepth.width,bDepth.height);`);
const inject=`
async function recalcSubject(){try{if(!subject)return stat('Détoure d’abord le sujet.');stat('Recalcul du sujet…');sDepth=depthImage(await infer(subject,+$('subjectDepthSize').value,true),subject,$('sd'));if(bg&&bDepth)build();stat('Sujet recalculé.','ok')}catch(e){stat('Erreur sujet : '+e.message)}}
async function recalcBg(){try{const f=$('customBgFile').files[0];if(f){bg=await imgFromBlob(f);preview(bg,$('bgPreview'));bgZoneMask=null;}if(!bg)return stat('Prépare ou charge d’abord un fond.');stat('Recalcul du fond…');bDepth=normalize(depthImage(await infer(bg,+$('bgDepthSize').value,false),bg,$('bd')),+$('bgContrast').value);bgZoneBaseDepth=new ImageData(new Uint8ClampedArray(bDepth.data),bDepth.width,bDepth.height);$('bd').getContext('2d').putImageData(bDepth,0,0);if(subject&&sDepth)build();stat('Fond recalculé.','ok')}catch(e){stat('Erreur fond : '+e.message)}}
function openBgZoneEditor(){if(!bg)return stat('Prépare ou charge d’abord un fond.');const m=document.createElement('div');Object.assign(m.style,{position:'fixed',inset:'0',zIndex:999999,background:'#09090b',display:'flex',flexDirection:'column',color:'#fff'});const bar=document.createElement('div');Object.assign(bar.style,{display:'flex',gap:'7px',padding:'9px',flexWrap:'wrap',background:'#17171a'});const wand=document.createElement('button'),add=document.createElement('button'),erase=document.createElement('button'),clear=document.createElement('button'),done=document.createElement('button');wand.textContent='🪄 Baguette';add.textContent='✏️ Doigt / Apple Pencil';erase.textContent='⌫ Gomme';clear.textContent='Effacer zones';done.textContent='✓ Terminer';for(const b of [wand,add,erase,clear,done]){b.style.minHeight='44px';b.style.margin='0'}bar.append(wand,add,erase,clear,done);const hint=document.createElement('div');hint.textContent='Baguette = toucher une zone. Doigt / Pencil = peindre librement. Gomme = retirer.';Object.assign(hint.style,{padding:'7px 10px',background:'#20242a',fontSize:'13px'});const c=document.createElement('canvas');Object.assign(c.style,{flex:'1',minHeight:'0',width:'100%',touchAction:'none',background:'#111'});m.append(bar,hint,c);document.body.appendChild(m);let mode='wand',drawing=false;const W=Math.min(900,bg.naturalWidth),H=Math.max(2,Math.round(W*bg.naturalHeight/bg.naturalWidth));c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});const base=document.createElement('canvas');base.width=W;base.height=H;base.getContext('2d').drawImage(bg,0,0,W,H);let mask=bgZoneMask&&bgZoneMask.width===W&&bgZoneMask.height===H?new ImageData(new Uint8ClampedArray(bgZoneMask.data),W,H):x.createImageData(W,H);function draw(){x.clearRect(0,0,W,H);x.drawImage(base,0,0);const ov=x.createImageData(W,H);for(let i=0;i<W*H;i++){const a=mask.data[i*4+3];if(!a)continue;ov.data[i*4]=0;ov.data[i*4+1]=220;ov.data[i*4+2]=255;ov.data[i*4+3]=Math.min(150,a)}x.putImageData(ov,0,0)}function pt(e){const r=c.getBoundingClientRect();return[Math.max(0,Math.min(W-1,Math.floor((e.clientX-r.left)*W/r.width))),Math.max(0,Math.min(H-1,Math.floor((e.clientY-r.top)*H/r.height)))]}function paint(px,py,on){const rr=18;for(let yy=Math.max(0,py-rr);yy<=Math.min(H-1,py+rr);yy++)for(let xx=Math.max(0,px-rr);xx<=Math.min(W-1,px+rr);xx++){if((xx-px)*(xx-px)+(yy-py)*(yy-py)>rr*rr)continue;mask.data[(yy*W+xx)*4+3]=on?255:0}draw()}function flood(px,py){const d=base.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H).data,si=(py*W+px)*4,sr=d[si],sg=d[si+1],sb=d[si+2],seen=new Uint8Array(W*H),q=[py*W+px];seen[py*W+px]=1;for(let qi=0;qi<q.length;qi++){const p=q[qi],xx=p%W,yy=(p/W)|0,o=p*4,dist=Math.hypot(d[o]-sr,d[o+1]-sg,d[o+2]-sb);if(dist>58)continue;mask.data[o+3]=255;for(const n of [p-1,p+1,p-W,p+W])if(n>=0&&n<W*H&&!seen[n]){seen[n]=1;q.push(n)}}draw()}function setMode(v){mode=v;wand.style.background=v==='wand'?'#0a6d8f':'#222b37';add.style.background=v==='add'?'#087544':'#222b37';erase.style.background=v==='erase'?'#8b2732':'#222b37'}wand.onclick=()=>setMode('wand');add.onclick=()=>setMode('add');erase.onclick=()=>setMode('erase');clear.onclick=()=>{mask=x.createImageData(W,H);draw()};c.onpointerdown=e=>{e.preventDefault();const [px,py]=pt(e);if(mode==='wand'){flood(px,py);return}drawing=true;c.setPointerCapture?.(e.pointerId);paint(px,py,mode==='add')};c.onpointermove=e=>{if(!drawing)return;e.preventDefault();const [px,py]=pt(e);paint(px,py,mode==='add')};c.onpointerup=c.onpointercancel=()=>drawing=false;done.onclick=()=>{bgZoneMask=mask;m.remove();if(frames.length)build();stat('Zones du fond enregistrées.','ok')};setMode('wand');draw()}
$('calcSubject').onclick=recalcSubject;$('calcBg').onclick=recalcBg;$('customBgFile').onchange=recalcBg;$('editBgZones').onclick=openBgZoneEditor;
`;
