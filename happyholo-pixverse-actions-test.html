<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HappyHolo — Actions PixVerse test</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f4f4f2}*{box-sizing:border-box}body{margin:0}.bar{position:sticky;top:0;z-index:10;background:#111;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}.bar b{font-size:17px}.badge{background:#ffd60a;color:#111;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:calc(100vh - 50px)}iframe{width:100%;height:calc(100vh - 50px);border:0;background:#fff}.side{padding:16px;background:#fff;border-left:1px solid #ddd;overflow:auto}h2{margin:0 0 5px}p{font-size:13px;color:#555;line-height:1.4}label{display:block;font-size:13px;font-weight:750;margin:13px 0 6px}select,button{width:100%;font:inherit;padding:12px;border-radius:11px}select{border:1px solid #ccc;background:#fff}button{border:0;background:#111;color:#fff;font-weight:800;margin-top:12px}button:disabled{opacity:.45}.prompt,.status{margin-top:12px;padding:11px;border-radius:11px;background:#f2f2f2;font-size:13px;line-height:1.4}.status{white-space:pre-wrap}video{width:100%;margin-top:12px;border-radius:12px;background:#111;display:none}.small{font-size:11px;color:#666;margin-top:8px}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid #ddd}.layout iframe{height:58vh}.bar{position:relative}}
</style>
</head>
<body>
<div class="bar"><b>HappyHolo + PixVerse</b><span class="badge">TEST ISOLÉ</span></div>
<div class="layout">
  <iframe id="hhApp" src="./relief3d-test-v31.html?v=pixverse-test" title="HappyHolo"></iframe>
  <aside class="side">
    <h2>Action PixVerse</h2>
    <p>Prépare l’image dans HappyHolo à gauche, puis lance une action. L’image du canvas final est envoyée en V6, 2 s, 540p, sans audio.</p>
    <label>Catégorie</label>
    <select id="family"><option value="person">Personne</option><option value="group">Duo / Groupe</option><option value="animal">Animal</option></select>
    <label>Action</label><select id="action"></select>
    <div id="prompt" class="prompt">Chargement…</div>
    <button id="run" disabled>Lancer PixVerse</button>
    <div id="status" class="status">Attends que HappyHolo soit chargé.</div>
    <video id="video" controls playsinline loop></video>
    <button id="rerun" style="display:none;background:#e8e8e8;color:#111">Relancer la même action</button>
    <div class="small">Aucune modification de main. Résultat conservé uniquement pour ce test.</div>
  </aside>
</div>
<script type="module">
import { loadActionLibrary, getActionVariant } from './modules/action-library.js';
import { runPixVerseAction } from './modules/pixverse-client.js';

const iframe=document.getElementById('hhApp');
const family=document.getElementById('family');
const action=document.getElementById('action');
const prompt=document.getElementById('prompt');
const run=document.getElementById('run');
const status=document.getElementById('status');
const video=document.getElementById('video');
const rerun=document.getElementById('rerun');
let library=null;

function setStatus(text,error=false,ok=false){status.textContent=text;status.style.background=error?'#ffe9e7':ok?'#e7f7eb':'#f2f2f2';status.style.color=error?'#8b1f17':ok?'#17652c':'#333'}
function selection(){return action.value?getActionVariant(library,action.value,family.value):null}
function refresh(){
  const acts=(library?.actions||[]).filter(a=>a.active!==false&&a.categories?.includes(family.value)&&a.variants?.some(v=>v.family===family.value));
  action.innerHTML=acts.map(a=>`<option value="${a.id}">${a.label}</option>`).join('');
  const s=selection();
  if(s){const v=s.variant;prompt.innerHTML=`<b>${s.action.label}</b><br>${v.prompt}<br><span style="color:#666">${v.duration||2} s · ${v.quality||'540p'} · audio ${v.audio?'ON':'OFF'}</span>`;run.disabled=false}else{prompt.textContent='Aucune action pour cette catégorie.';run.disabled=true}
}
function canvasToFile(canvas){return new Promise((resolve,reject)=>{if(!canvas)return reject(new Error('Canvas final HappyHolo introuvable.'));canvas.toBlob(blob=>blob?resolve(new File([blob],`happyholo-${Date.now()}.png`,{type:'image/png'})):reject(new Error('Impossible de préparer l’image finale.')),'image/png',.95)})}
async function launch(){
  if(!navigator.onLine){setStatus('PixVerse nécessite Internet.',true);return}
  const s=selection();if(!s)return;
  run.disabled=true;video.style.display='none';rerun.style.display='none';
  try{
    setStatus('Préparation de l’image finale HappyHolo…');
    const doc=iframe.contentDocument;
    const canvas=doc?.getElementById('view');
    const file=await canvasToFile(canvas);
    const result=await runPixVerseAction(file,s.variant,{onStatus:x=>{const map={upload:'1/4 — Envoi image…',create:'2/4 — Génération 2 s / 540p lancée…',processing:'3/4 — Génération PixVerse en cours…',done:'4/4 — MP4 reçu.'};setStatus(map[x.step]||'Traitement…')}});
    video.src=result.videoUrl;video.style.display='block';rerun.style.display='block';setStatus(`Connexion validée — vidéo #${result.videoId} récupérée dans HappyHolo.`,false,true);try{await video.play()}catch(_){}
    window.HappyHoloLastPixVerseResult={...result,actionId:s.action.id,variantId:s.variant.id};
  }catch(e){setStatus(`Erreur : ${e.message}`,true)}finally{run.disabled=false}
}
family.onchange=refresh;action.onchange=refresh;run.onclick=launch;rerun.onclick=launch;
iframe.addEventListener('load',()=>setStatus('HappyHolo chargé. Prépare une image puis lance l’action.'));
try{library=await loadActionLibrary();refresh()}catch(e){setStatus(`Bibliothèque indisponible : ${e.message}`,true)}
</script>
</body>
</html>
