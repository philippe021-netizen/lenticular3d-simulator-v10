<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>MicroPlayer — Prototype Tripo API</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#111;color:#eee}
  main{max-width:760px;margin:auto;padding:22px}
  .card{background:#1b1b1b;border:1px solid #333;border-radius:16px;padding:18px;margin:14px 0}
  h1{font-size:25px;margin:0 0 10px} h2{font-size:18px}
  button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,select{font:inherit;width:100%;box-sizing:border-box;margin:7px 0 14px;padding:10px;border-radius:10px;border:1px solid #555;background:#121212;color:#fff}
  progress{width:100%;height:18px}
  img{max-width:100%;border-radius:12px;background:#fff}
  .muted{color:#aaa;font-size:14px}.ok{color:#8fdc9d}.err{color:#ff9b9b}
</style>
</head>
<body><main>
  <h1>Prototype MicroPlayer → Tripo</h1>
  <p class="muted">Test isolé. Il ne modifie pas le programme principal.</p>

  <div class="card">
    <label>Photo source</label>
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp" />
    <label>Texture</label>
    <select id="texture"><option value="extreme" selected>Extreme</option><option value="detailed">Detailed</option><option value="standard">Standard</option></select>
    <label>Géométrie</label>
    <select id="geometry"><option value="detailed" selected>Ultra / détaillée</option><option value="standard">Standard</option></select>
    <button id="go">Créer le modèle 3D PBR</button>
  </div>

  <div class="card">
    <div id="state">En attente.</div>
    <progress id="progress" max="100" value="0"></progress>
    <div id="task" class="muted"></div>
  </div>

  <div id="result" class="card" hidden>
    <h2>Résultat Tripo</h2>
    <img id="preview" hidden alt="Aperçu 3D Tripo" />
    <p><a id="download" href="#" target="_blank" rel="noopener">Télécharger le GLB PBR</a></p>
    <p class="muted">Le lien Tripo est temporaire : télécharge le GLB dès que le résultat apparaît.</p>
  </div>

<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function compressImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();
    await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url});
    const max=1600, scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.max(1,Math.round(img.naturalWidth*scale));
    const h=Math.max(1,Math.round(img.naturalHeight*scale));
    const c=document.createElement('canvas'); c.width=w;c.height=h;
    c.getContext('2d',{alpha:false}).drawImage(img,0,0,w,h);
    return c.toDataURL('image/jpeg',0.88);
  }finally{URL.revokeObjectURL(url)}
}

async function api(url,opts){
  const r=await fetch(url,opts); let j={};
  try{j=await r.json()}catch{}
  if(!r.ok || j.error) throw new Error(j.error || `Erreur HTTP ${r.status}`);
  return j;
}

$('go').onclick=async()=>{
  const file=$('file').files[0];
  if(!file){$('state').innerHTML='<span class="err">Choisis une photo.</span>';return}
  $('go').disabled=true;$('result').hidden=true;$('progress').value=0;$('task').textContent='';
  try{
    $('state').textContent='Compression de la photo…';
    const dataUrl=await compressImage(file);

    $('state').textContent='Envoi à Tripo…';
    const up=await api('/api/happyholo-health?action=tripo-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data_url:dataUrl})});

    $('state').textContent='Création du modèle PBR…';
    const created=await api('/api/happyholo-health?action=tripo-create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image_token:up.image_token,texture_quality:$('texture').value,geometry_quality:$('geometry').value})});
    $('task').textContent='Task ID : '+created.task_id;

    const deadline=Date.now()+8*60*1000;
    while(Date.now()<deadline){
      const st=await api('/api/happyholo-health?action=tripo-status&task_id='+encodeURIComponent(created.task_id));
      $('progress').value=st.progress||0;
      $('state').textContent=`Tripo : ${st.status||'en cours'} — ${st.progress||0}%`;
      if(st.status==='success'){
        const glb=st.output?.pbr_model || st.output?.model;
        if(!glb) throw new Error('Tâche terminée mais aucun GLB n’a été renvoyé.');
        $('download').href=glb;
        if(st.output?.rendered_image){$('preview').src=st.output.rendered_image;$('preview').hidden=false}else{$('preview').hidden=true}
        $('result').hidden=false;
        $('state').innerHTML='<span class="ok">Modèle PBR terminé.</span>';
        return;
      }
      if(['failed','cancelled','banned','expired','unknown'].includes(st.status)) throw new Error('Tâche Tripo terminée avec le statut : '+st.status);
      await sleep(2500);
    }
    throw new Error('Temps d’attente dépassé (8 min).');
  }catch(e){
    $('state').innerHTML='<span class="err">'+String(e.message||e)+'</span>';
  }finally{$('go').disabled=false}
};
</script>
</main></body></html>
