<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LentiPrint Lab — Relief 3D V3.3.27</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f4f2;color:#171717}
#boot{padding:24px;font-weight:700}
</style>
</head>
<body>
<div id="boot">Chargement de Relief 3D V3.3.27…</div>
<script>
(async()=>{
  try{
    let h=await (await fetch('./relief3d-test-v3325.html',{cache:'no-store'})).text();

    h=h.replaceAll('V3.3.25','V3.3.27');

    const oldTag='<script type="module" src="./relief-engine-v3325.js"></'+'script>';
    const newTags='<script src="./relief-engine-v3325.js"></'+'script>'+
                  '<script src="./mask-editor-v3326.js"></'+'script>';

    if(!h.includes(oldTag)){
      throw new Error('Balise moteur V3.3.25 introuvable.');
    }

    h=h.replace(oldTag,newTags);

    document.open();
    document.write(h);
    document.close();
  }catch(e){
    document.getElementById('boot').textContent='Erreur V3.3.27 : '+(e?.message||e);
    console.error(e);
  }
})();
</script>
</body>
</html>
