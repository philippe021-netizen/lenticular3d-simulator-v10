name: HappyHolo pan fluid patch

on:
  push:
    paths:
      - '.github/workflows/patch-pan-fluid-v317.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'HappyHolo V3.17 pan fluide'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch mask editor
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('mask-editor-v315-panfix.js')
          text = p.read_text(encoding='utf-8')

          backup = Path('backups/2026-08-27/mask-editor-v315-panfix-before-panfluid-v316.js')
          backup.parent.mkdir(parents=True, exist_ok=True)
          if not backup.exists():
              backup.write_text(text, encoding='utf-8')

          original = text

          text = text.replace('/* HappyHolo — éditeur masque V3.16', '/* HappyHolo — éditeur masque V3.17', 1)

          text, n1 = re.subn(
              r"(panX=p\.x-startPanX;\s*panY=p\.y-startPanY;\s*)baseDirty=true;\s*maskDirty=true;(\s*continue;)",
              r"\1baseDirty=true;\2",
              text,
              count=1,
              flags=re.S,
          )

          text, n2 = re.subn(
              r"requestRender\(\s*tool==='pan',\s*true\s*\);\s*requestLoupe\(\);",
              "if(tool==='pan'){\n        requestRender(true,false);\n        return;\n      }\n\n      requestRender(false,true);\n      requestLoupe();",
              text,
              count=1,
              flags=re.S,
          )

          text = text.replace(
              "[HAPPYHOLO] mask-editor V3.16 — clin d’œil Pencil + zoom + pan actif",
              "[HAPPYHOLO] mask-editor V3.17 — clin d’œil Pencil + zoom + pan fluide actif",
              1,
          )

          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Patch non appliqué correctement: pan block={n1}, render block={n2}')
          if text == original:
              raise SystemExit('Aucune modification produite')

          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check mask-editor-v315-panfix.js

      - name: Remove temporary workflow and commit
        run: |
          git config user.name "HappyHolo automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/patch-pan-fluid-v317.yml
          git add mask-editor-v315-panfix.js backups/2026-08-27/mask-editor-v315-panfix-before-panfluid-v316.js
          git commit -m "HappyHolo V3.17 pan fluide"
          git push origin main
