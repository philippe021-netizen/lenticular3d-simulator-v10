<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HappyHolo — Tiefling double traitement V4</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0d1117;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<iframe id="app" src="./tiefling-dual-v3.html"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  try{
    const d=frame.contentDocument;
    const strength=d.getElementById('subjectStrength');
    const volume=d.getElementById('subjectVolume');
    const parallax=d.getElementById('parallax');
    const bgStrength=d.getElementById('bgStrength');
    const bgDrift=d.getElementById('bgDrift');
    if(strength){
      strength.max='190';
      strength.value='150';
      const row=strength.previousElementSibling;
      if(row){const lab=row.querySelector('label');if(lab)lab.textContent='Déplacement sujet';}
      strength.dispatchEvent(new Event('input',{bubbles:true}));
    }
    if(volume){volume.value='10';volume.dispatchEvent(new Event('input',{bubbles:true}));}
    if(parallax){parallax.value='32';parallax.dispatchEvent(new Event('input',{bubbles:true}));}
    if(bgStrength){bgStrength.value='68';bgStrength.dispatchEvent(new Event('input',{bubbles:true}));}
    if(bgDrift){bgDrift.value='55';bgDrift.dispatchEvent(new Event('input',{bubbles:true}));}
    const h1=d.querySelector('h1');if(h1)h1.textContent='HappyHolo — Tiefling double traitement V4';
    const p=d.querySelector('.wrap > .hint');if(p)p.textContent='Sujet plus mobile : translation renforcée, volume interne limité pour éviter les doubles contours.';
  }catch(e){console.error(e)}
});
</script>
</body>
</html>
