<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<title>HappyHolo — Relief 3D V3.1.7 offline</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#171717;background:#f4f4f2}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:22px}
h1{margin:0 0 8px}.sub{color:#555;margin-bottom:16px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:18px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
label{font-size:13px;font-weight:700;display:block;margin:13px 0 6px}
input[type=file],button{font:inherit}input[type=range]{width:100%}
button{border:0;border-radius:12px;padding:12px 15px;font-weight:750;background:#111;color:#fff;margin:8px 6px 0 0}
button.secondary{background:#e8e8e8;color:#111}button:disabled{opacity:.45}
.status{margin-top:12px;padding:11px;border-radius:11px;background:#f2f2f2;white-space:pre-wrap;font-size:13px}
canvas{width:100%;border-radius:14px;background:#111;display:block;aspect-ratio:4/3;object-fit:contain}
.row{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.small{font-size:12px;color:#666;line-height:1.4;margin-top:8px}
.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.frames img{width:100%;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
<h1>HappyHolo — Relief 3D V3.1.7 offline</h1>
<div class="sub">Photo → détourage local → correction doigt/Pencil → fond reconstruit localement → profondeur séparée → 9 vues.</div>
<div class="card grid">
<section>
<label>Photo</label><input id="file" type="file" accept="image/*">
<label>Force profondeur sujet</label>
<div class="row"><span>Volume interne</span><b id="subjectOut">0.48</b></div>
<input id="subjectDepth" type="range" min="0.10" max="0.55" step="0.01" value="0.48">
<label>Force profondeur fond</label>
<div class="row"><span>Décor</span><b id="bgOut">0.10</b></div>
<input id="bgDepth" type="range" min="0.02" max="0.25" step="0.01" value="0.10">
<label>Amplitude</label>
<div class="row"><span>Parallaxe</span><b id="angleOut">±7°</b></div>
<input id="angle" type="range" min="2" max="8" step="1" value="7">
<label>Protection contours</label>
<div class="row"><span>Cheveux / détails fins</span><b id="edgeOut">84%</b></div>
<input id="edgeProtect" type="range" min="55" max="95" step="1" value="84">
<button id="build">Créer le relief 3D local</button>
<button id="export" class="secondary" disabled>Exporter 9 vues</button>
<button id="download" class="secondary" disabled>Télécharger ZIP</button>
<div id="status" class="status">Choisis une photo.</div>
<div class="small">Correction optimisée iPad — doigt + Apple Pencil.</div>
</section>
<section>
<canvas id="view" width="1024" height="768"></canvas>
<div id="frames" class="frames"></div>
</section>
</div>
</div>
<script src="./relief-engine-v31.js"></script>
<script src="./mask-editor-v315-panfix.js"></script>
<script src="./v311-monotonic-patch.js"></script>
<script src="./offline-manager.js"></script>
</body>
</html>
