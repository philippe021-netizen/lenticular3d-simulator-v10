<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MicroPlayer V38</title><style>body{margin:0;padding:16px;background:#0b0c10;color:#f5f7fa;font-family:-apple-system,system-ui}main{max-width:1050px;margin:auto}.card{background:#15171d;border:1px solid #292d36;border-radius:18px;padding:16px;margin:14px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,.file{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:#fff;color:#111}.file input{display:none}.stage,.simstage{position:relative;background:#000;border-radius:14px;overflow:hidden;margin-top:12px;line-height:0}.stage canvas,.simstage canvas{width:100%;height:auto;display:block}#overlay{position:absolute;inset:0;touch-action:none}.controls{display:grid;grid-template-columns:150px 1fr 52px;gap:8px;align-items:center;margin:10px 0}.controls input{width:100%}.spectrum{height:26px;border-radius:8px;background:linear-gradient(90deg,#050505,#fff)}.status{padding:11px;background:#20242d;border-radius:12px;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.view{position:relative;background:#000;border-radius:10px;overflow:hidden}.view canvas{width:100%;display:block}.badge{position:absolute;top:5px;left:5px;background:#000c;padding:4px 7px;border-radius:7px}.sim{display:none}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:110px 1fr 45px}}</style></head><body><main><h1>DepthFlow V38 — iPad stable</h1><p>Spectre continu noir → blanc, Pencil rapide, génération progressive des 9 vues pour éviter le blocage mémoire.</p><section class="card"><div class="row"><label class="file">Choisir photo<input id="file" type="file" accept="image/*"></label><button id="calc" disabled>1. Calculer profondeur</button><button id="gen" disabled>3. Générer 9 vues</button></div><div id="status" class="status">Prêt.</div></section><section class="card"><strong>2. Correction profondeur</strong><div class="spectrum"></div><div class="controls"><label>Profondeur</label><input id="level" type="range" min="0" max="255" value="128"><output id="levelOut">128</output></div><div class="controls"><label>Douceur</label><input id="soft" type="range" min="0.05" max="1" step="0.05" value=".30"><output id="softOut">0.30</output></div><div class="controls"><label>Pinceau</label><input id="brush" type="range" min="4" max="120" value="32"><output id="brushOut">32</output></div><div class="row"><button id="paint">✏️ Pencil</button><button id="erase">Gomme</button><button id="map">Afficher carte</button><button id="reset">Effacer corrections</button></div><div class="stage"><canvas id="photo"></canvas><canvas id="overlay"></canvas></div></section><section id="sim" class="card sim"><strong>Simulateur</strong><button id="auto">▶ Auto</button><div class="simstage"><canvas id="simc"></canvas></div><input id="simr" type="range" min="0" max="8" step=".01" value="4" style="width:100%"></section><div id="grid" class="grid"></div></main><script type="module">import{pipeline,env}from'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0';env.allowLocalModels=false;const $=x=>document.getElementById(x),file=$('file'),calc=$('calc'),gen=$('gen'),status=$('status'),photo=$('photo'),overlay=$('overlay'),grid=$('grid'),sim=$('sim'),simc=$('simc'),simr=$('simr');let url,base,edit,weight,est,mode='paint',down=false,last,rect,frames=[],running=false,dir=1,tm=0,show=false;for(let id of['level','soft','brush'])$(id).oninput=()=>$(id+'Out').textContent=$(id).value;$('paint').onclick=()=>mode='paint';$('erase').onclick=()=>mode='erase';file.onchange=async()=>{let f=file.files?.[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);let im=await load(url),w=Math.min(1000,im.naturalWidth),h=Math.round(im.naturalHeight*w/im.naturalWidth);photo.width=overlay.width=w;photo.height=overlay.height=h;photo.getContext('2d').drawImage(im,0,0,w,h);calc.disabled=false;gen.disabled=true;status.textContent='Photo prête.'};calc.onclick=async()=>{try{calc.disabled=true;status.textContent='Calcul profondeur…';if(!est)est=await pipeline('depth-estimation','onnx-community/depth-anything-v2-small',{device:'wasm'});let r=await est(url);base=toDepth(r.predicted_depth||r.depth,photo.width,photo.height);edit=canvas(photo.width,photo.height);edit.getContext('2d').drawImage(base,0,0);weight=canvas(photo.width,photo.height);gen.disabled=false;render();status.textContent='Carte prête.'}catch(e){status.textContent='Erreur profondeur : '+e.message}finally{calc.disabled=false}};function pt(e){return{x:(e.clientX-rect.left)*overlay.width/rect.width,y:(e.clientY-rect.top)*overlay.height/rect.height}}function seg(a,b){let v=+$('level').value,al=+$('soft').value,s=+$('brush').value,dc=edit.getContext('2d'),wc=weight.getContext('2d'),oc=overlay.getContext('2d');for(let c of[dc,wc,oc]){c.save();c.lineCap=c.lineJoin='round';c.lineWidth=s;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y)}if(mode==='erase'){for(let c of[wc,oc]){c.globalCompositeOperation='destination-out';c.strokeStyle='#fff';c.stroke()}}else{dc.globalAlpha=al;dc.strokeStyle=`rgb(${v},${v},${v})`;dc.stroke();wc.globalAlpha=Math.min(1,al+.15);wc.strokeStyle='#fff';wc.stroke();oc.globalAlpha=.45;oc.strokeStyle=`rgb(${v},${v},${v})`;oc.stroke()}for(let c of[dc,wc,oc])c.restore()}overlay.onpointerdown=e=>{if(!edit)return;down=true;rect=overlay.getBoundingClientRect();last=pt(e);overlay.setPointerCapture(e.pointerId);seg(last,last);e.preventDefault()};overlay.onpointermove=e=>{if(!down)return;for(let ev of(e.getCoalescedEvents?.()||[e])){let p=pt(ev);seg(last,p);last=p}e.preventDefault()};function finish(e){if(!down)return;down=false;render();e.preventDefault()}overlay.onpointerup=overlay.onpointercancel=finish;$('map').onclick=()=>{show=!show;$('map').textContent=show?'Masquer carte':'Afficher carte';render()};$('reset').onclick=()=>{if(!base)return;edit.getContext('2d').clearRect(0,0,edit.width,edit.height);edit.getContext('2d').drawImage(base,0,0);weight.getContext('2d').clearRect(0,0,weight.width,weight.height);render()};function render(){if(!edit)return;let x=overlay.getContext('2d');x.clearRect(0,0,overlay.width,overlay.height);x.globalAlpha=show?.72:.3;x.drawImage(show?edit:weight,0,0);x.globalAlpha=1}function finalDepth(w,h){let a=base.getContext('2d').getImageData(0,0,base.width,base.height),b=edit.getContext('2d').getImageData(0,0,edit.width,edit.height),m=weight.getContext('2d').getImageData(0,0,weight.width,weight.height),c=canvas(base.width,base.height),x=c.getContext('2d'),o=x.createImageData(c.width,c.height);for(let i=0;i<o.data.length;i+=4){let k=m.data[i]/255,v=a.data[i]*(1-k)+b.data[i]*k;o.data[i]=o.data[i+1]=o.data[i+2]=v;o.data[i+3]=255}x.putImageData(o,0,0);if(w===c.width&&h===c.height)return c;let d=canvas(w,h);d.getContext('2d').drawImage(c,0,0,w,h);return d}gen.onclick=async()=>{if(gen.disabled)return;gen.disabled=true;running=false;try{let scale=Math.min(1,800/photo.width),w=Math.round(photo.width*scale),h=Math.round(photo.height*scale),src=canvas(w,h);src.getContext('2d').drawImage(photo,0,0,w,h);status.textContent='Préparation profondeur…';await yieldUI();let dep=finalDepth(w,h);grid.innerHTML='';frames=[];for(let i=0;i<9;i++){status.textContent=`Génération vue ${i+1}/9…`;await yieldUI();let c=canvas(w,h);if(i===4)c.getContext('2d').drawImage(src,0,0);else warp(c,src,dep,(i-4)/4);frames.push(c);let d=document.createElement('div'),b=document.createElement('span');d.className='view';b.className='badge';b.textContent=String(i+1).padStart(2,'0')+(i===4?' — original':'');d.append(c,b);grid.append(d);await yieldUI()}simc.width=w;simc.height=h;simr.value=4;draw(4);sim.style.display='block';status.textContent='V38 : 9 vues générées.';sim.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){status.textContent='Erreur génération : '+e.message}finally{gen.disabled=false}};function warp(out,src,dep,pos){let w=out.width,h=out.height,s=src.getContext('2d').getImageData(0,0,w,h),d=dep.getContext('2d').getImageData(0,0,w,h).data,x=out.getContext('2d'),o=x.createImageData(w,h);for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){let i=(y*w+xx)*4,z=d[i]/255-.5,sx=Math.max(0,Math.min(w-1,Math.round(xx+pos*z*w*.032))),q=(y*w+sx)*4;o.data[i]=s.data[q];o.data[i+1]=s.data[q+1];o.data[i+2]=s.data[q+2];o.data[i+3]=255}x.putImageData(o,0,0)}simr.oninput=()=>{running=false;draw(+simr.value)};function draw(v){if(!frames.length)return;let a=Math.floor(v),b=Math.min(8,a+1),m=v-a,x=simc.getContext('2d');x.globalAlpha=1;x.drawImage(frames[a],0,0);if(b!==a){x.globalAlpha=m;x.drawImage(frames[b],0,0);x.globalAlpha=1}}$('auto').onclick=()=>{running=!running;if(running){tm=performance.now();requestAnimationFrame(tick)}};function tick(t){if(!running)return;let dt=Math.min(.05,(t-tm)/1000);tm=t;let v=+simr.value+dir*dt*2;if(v>=8){v=8;dir=-1}if(v<=0){v=0;dir=1}simr.value=v;draw(v);requestAnimationFrame(tick)}function toDepth(raw,w,h){let data=raw?.data??raw?.cpuData??raw,dims=raw?.dims??raw?.shape??[];if(data?.data)data=data.data;let dd=Array.from(dims||[]),sw=raw?.width||dd.at(-1),sh=raw?.height||dd.at(-2);if(!sw||!sh){sw=Math.round(Math.sqrt(data.length*w/h));sh=Math.floor(data.length/sw)}let vals=[];for(let v of data){v=+v;if(Number.isFinite(v))vals.push(v)}vals.sort((a,b)=>a-b);let mn=vals[Math.floor(vals.length*.02)]??0,mx=vals[Math.floor(vals.length*.98)]??1,span=Math.max(1e-9,mx-mn),c=canvas(sw,sh),x=c.getContext('2d'),im=x.createImageData(sw,sh);for(let i=0;i<sw*sh;i++){let v=+data[i];if(!Number.isFinite(v))v=mn;v=Math.max(0,Math.min(255,Math.round((v-mn)/span*255)));let j=i*4;im.data[j]=im.data[j+1]=im.data[j+2]=v;im.data[j+3]=255}x.putImageData(im,0,0);let o=canvas(w,h);o.getContext('2d').drawImage(c,0,0,w,h);return o}function canvas(w,h){let c=document.createElement('canvas');c.width=w;c.height=h;return c}function load(u){return new Promise((r,j)=>{let i=new Image;i.onload=()=>r(i);i.onerror=j;i.src=u})}function yieldUI(){return new Promise(r=>setTimeout(r,20))}</script></body></html>
