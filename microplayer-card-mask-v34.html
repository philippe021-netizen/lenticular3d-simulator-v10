<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>MicroPlayer V34 Masques</title><style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{padding:14px 18px;border-bottom:1px solid #303846}.wrap{max-width:1450px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:370px 1fr;gap:14px}.p{background:#151a22;border:1px solid #303846;border-radius:16px;padding:14px;margin-bottom:12px}button,input{font:inherit}button{width:100%;min-height:46px;border:0;border-radius:11px;background:#1687ff;color:white;font-weight:800;margin-top:8px}.stage{position:relative;overflow:hidden;background:#050608;border-radius:12px}.stage canvas{display:block;width:100%;height:auto}.layer{padding:9px;border:1px solid #394352;border-radius:10px;margin:7px 0;cursor:pointer}.layer.on{border-color:#1687ff;background:#172b42}.small{font-size:12px;color:#aeb8c6}.status{padding:10px;border-radius:10px;background:#252c36;margin-top:9px}.ok{background:#17392e}.warn{background:#493b18}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><b>MicroPlayer — Validation masques V34</b> · polygones IA avant relief</div><main class="wrap"><div class="grid"><aside><div class="p"><input id="file" type="file" accept="image/*"><button id="go" disabled>Reconnaître et segmenter</button><div id="st" class="status">Importe la carte.</div></div><div class="p"><b>Éléments reconnus</b><div class="small">Touche un élément pour afficher uniquement son masque.</div><div id="list"></div></div></aside><section class="p"><div class="stage"><canvas id="cv"></canvas></div><button id="all" disabled>Afficher tous les masques</button><div class="small" style="margin-top:8px">Le relief reste volontairement désactivé ici : on valide d'abord que chaque sélection épouse réellement l'élément.</div></section></div></main><script>const $=x=>document.getElementById(x),cv=$('cv'),x=cv.getContext('2d'),S={img:null,data:null,layers:[],sel:-2};const stat=(t,c='')=>{$('st').textContent=t;$('st').className='status '+c};const read=f=>new Promise((r,j)=>{const q=new FileReader;q.onload=()=>r(q.result);q.onerror=j;q.readAsDataURL(f)});const load=u=>new Promise((r,j)=>{const i=new Image;i.onload=()=>r(i);i.onerror=j;i.src=u});$('file').onchange=async()=>{const f=$('file').files?.[0];if(!f)return;S.data=await read(f);S.img=await load(S.data);const w=Math.min(2048,S.img.naturalWidth),h=Math.round(w*S.img.naturalHeight/S.img.naturalWidth);cv.width=w;cv.height=h;draw();$('go').disabled=false;stat('Carte prête. Lance la segmentation.','ok')};function path(p){if(!p?.length)return null;const q=new Path2D;q.moveTo(p[0][0]*cv.width,p[0][1]*cv.height);for(let i=1;i<p.length;i++)q.lineTo(p[i][0]*cv.width,p[i][1]*cv.height);q.closePath();return q}function draw(){if(!S.img)return;x.clearRect(0,0,cv.width,cv.height);x.drawImage(S.img,0,0,cv.width,cv.height);if(!S.layers.length)return;x.save();S.layers.forEach((l,i)=>{if(S.sel>=0&&i!==S.sel)return;const p=path(l.polygon);if(!p)return;x.fillStyle=S.sel===i?'rgba(0,170,255,.48)':'rgba(0,170,255,.27)';x.strokeStyle='#00d9ff';x.lineWidth=Math.max(2,cv.width/700);x.fill(p);x.stroke(p)});x.restore()}function list(){const r=$('list');r.innerHTML='';S.layers.forEach((l,i)=>{const d=document.createElement('div');d.className='layer'+(S.sel===i?' on':'');d.innerHTML='<b>'+esc(l.label)+'</b><div class="small">'+esc(l.type)+' · '+esc(l.role)+' · '+Math.round((l.confidence||0)*100)+'%</div>';d.onclick=()=>{S.sel=i;list();draw()};r.appendChild(d)})}const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));$('all').onclick=()=>{S.sel=-2;list();draw()};$('go').onclick=async()=>{try{stat('Segmentation polygonale en cours…','warn');const r=await fetch('/api/card-layer-analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:S.data})}),d=await r.json();if(!r.ok)throw Error(d.error||r.status);S.layers=(d.layers||[]).filter(l=>Array.isArray(l.polygon)&&l.polygon.length>=3);S.sel=-2;list();draw();$('all').disabled=false;stat(S.layers.length+' masques polygonaux reconnus · '+(d.segmentation||''),'ok')}catch(e){stat(e.message)}};</script></body></html>
