<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>MicroPlayer V35 Masques pixels</title><style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{padding:14px 18px;border-bottom:1px solid #303846}.wrap{max-width:1450px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:370px 1fr;gap:14px}.p{background:#151a22;border:1px solid #303846;border-radius:16px;padding:14px;margin-bottom:12px}button,input{font:inherit}button{width:100%;min-height:46px;border:0;border-radius:11px;background:#1687ff;color:white;font-weight:800;margin-top:8px}.stage{overflow:hidden;background:#050608;border-radius:12px}.stage canvas{display:block;width:100%;height:auto}.layer{padding:9px;border:1px solid #394352;border-radius:10px;margin:7px 0;cursor:pointer}.layer.on{border-color:#1687ff;background:#172b42}.small{font-size:12px;color:#aeb8c6}.status{padding:10px;border-radius:10px;background:#252c36;margin-top:9px}.ok{background:#17392e}.warn{background:#493b18}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><div class="top"><b>MicroPlayer — Validation masques V35</b> · IA localise, moteur pixels affine</div><main class="wrap"><div class="grid"><aside><div class="p"><input id="file" type="file" accept="image/*"><button id="go" disabled>Reconnaître + affiner pixels</button><div id="st" class="status">Importe la carte.</div></div><div class="p"><b>Éléments reconnus</b><div class="small">Touche un élément pour contrôler son vrai masque pixel.</div><div id="list"></div></div></aside><section class="p"><div class="stage"><canvas id="cv"></canvas></div><button id="all" disabled>Afficher tous les masques pixels</button><div class="small" style="margin-top:8px">Cyan plein = pixels réellement retenus. Le polygone IA sert seulement de zone de recherche.</div></section></div></main><script>const $=x=>document.getElementById(x),cv=$('cv'),ctx=cv.getContext('2d',{willReadFrequently:true}),S={img:null,data:null,rgba:null,layers:[],sel:-2};const stat=(t,c='')=>{$('st').textContent=t;$('st').className='status '+c};const read=f=>new Promise((r,j)=>{const q=new FileReader;q.onload=()=>r(q.result);q.onerror=j;q.readAsDataURL(f)}),load=u=>new Promise((r,j)=>{const i=new Image;i.onload=()=>r(i);i.onerror=j;i.src=u});$('file').onchange=async()=>{const f=$('file').files?.[0];if(!f)return;S.data=await read(f);S.img=await load(S.data);const w=Math.min(2048,S.img.naturalWidth),h=Math.round(w*S.img.naturalHeight/S.img.naturalWidth);cv.width=w;cv.height=h;ctx.drawImage(S.img,0,0,w,h);S.rgba=ctx.getImageData(0,0,w,h).data;S.layers=[];draw();$('go').disabled=false;stat('Carte prête. Lance l’affinage pixel.','ok')};function polyPath(p){const q=new Path2D;if(!p?.length)return q;q.moveTo(p[0][0]*cv.width,p[0][1]*cv.height);for(let i=1;i<p.length;i++)q.lineTo(p[i][0]*cv.width,p[i][1]*cv.height);q.closePath();return q}function polygonMask(p){const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;const z=c.getContext('2d');z.fillStyle='#fff';z.fill(polyPath(p));return z.getImageData(0,0,c.width,c.height).data}function lum(r,g,b){return .2126*r+.7152*g+.0722*b}function refine(l){const pm=polygonMask(l.polygon),w=cv.width,h=cv.height,out=new Uint8ClampedArray(w*h),b=l.bbox||[0,0,1,1],x0=Math.max(0,Math.floor(b[0]*w)),y0=Math.max(0,Math.floor(b[1]*h)),x1=Math.min(w,Math.ceil((b[0]+b[2])*w)),y1=Math.min(h,Math.ceil((b[1]+b[3])*h));let br=0,bg=0,bb=0,bn=0;const edge=Math.max(1,Math.round(Math.min(x1-x0,y1-y0)*.12));for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){if(x>x0+edge&&x<x1-edge&&y>y0+edge&&y<y1-edge)continue;const i=y*w+x,j=i*4;if(pm[j]<128)continue;br+=S.rgba[j];bg+=S.rgba[j+1];bb+=S.rgba[j+2];bn++}br/=bn||1;bg/=bn||1;bb/=bn||1;const textish=['text','logo','object','signature','qr'].includes(l.type);for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const i=y*w+x,j=i*4;if(pm[j]<128)continue;const r=S.rgba[j],g=S.rgba[j+1],bl=S.rgba[j+2],cd=Math.hypot(r-br,g-bg,bl-bb),ld=Math.abs(lum(r,g,bl)-lum(br,bg,bb));let keep;if(textish){keep=cd>30||ld>24;if(l.type==='text'&&Math.max(r,g,bl)-Math.min(r,g,bl)>18)keep=keep||cd>20}else keep=true;if(keep)out[i]=255}/* one light morphology pass: remove isolated noise, fill tiny glyph holes */if(textish){const a=out.slice();for(let y=Math.max(1,y0);y<Math.min(h-1,y1);y++)for(let x=Math.max(1,x0);x<Math.min(w-1,x1);x++){const i=y*w+x;let n=0;for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++)if(a[(y+yy)*w+x+xx])n++;if(a[i]&&n<=2)out[i]=0;else if(!a[i]&&n>=7)out[i]=255}}l.mask=out;l.cover=out.reduce((a,v)=>a+(v?1:0),0)/(w*h)}function draw(){if(!S.img)return;ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(S.img,0,0,cv.width,cv.height);const im=ctx.getImageData(0,0,cv.width,cv.height),d=im.data;S.layers.forEach((l,k)=>{if(S.sel>=0&&k!==S.sel)return;if(!l.mask)return;for(let i=0,j=0;i<l.mask.length;i++,j+=4)if(l.mask[i]){d[j]=0;d[j+1]=205;d[j+2]=255;d[j+3]=Math.max(d[j+3],205)}});ctx.putImageData(im,0,0)}function list(){const r=$('list');r.innerHTML='';S.layers.forEach((l,i)=>{const d=document.createElement('div');d.className='layer'+(S.sel===i?' on':'');d.innerHTML='<b>'+esc(l.label)+'</b><div class="small">'+esc(l.type)+' · '+esc(l.role)+' · masque '+(l.cover*100).toFixed(2)+'%</div>';d.onclick=()=>{S.sel=i;list();draw()};r.appendChild(d)})}const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));$('all').onclick=()=>{S.sel=-2;list();draw()};$('go').onclick=async()=>{try{stat('IA + affinage pixel local…','warn');const r=await fetch('/api/card-layer-analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:S.data})}),d=await r.json();if(!r.ok)throw Error(d.error||r.status);S.layers=(d.layers||[]).filter(l=>Array.isArray(l.polygon)&&l.polygon.length>=3);S.layers.forEach(refine);S.sel=-2;list();draw();$('all').disabled=false;stat(S.layers.length+' masques affinés pixel par pixel · V35','ok')}catch(e){stat(e.message)}};</script></body></html>
