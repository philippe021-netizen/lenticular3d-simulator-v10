<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>MicroPlayer Carte 3D V32C</title><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#090b10}*{box-sizing:border-box}body{margin:0}.top{padding:14px 18px;background:#0d1118;border-bottom:1px solid #2d3542;display:flex;justify-content:space-between}.wrap{max-width:1450px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:390px 1fr;gap:14px}.panel{background:#151a22;border:1px solid #303846;border-radius:16px;padding:14px;margin-bottom:12px}button,select,input{font:inherit}button{min-height:44px;border:0;border-radius:11px;padding:9px 12px;background:#2d3542;color:#fff;font-weight:800}.primary{background:#1687ff}.green{background:#187153}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stage,.sim{position:relative;overflow:hidden;border-radius:13px;background:#050608;aspect-ratio:1.5858}.stage canvas,.sim canvas{position:absolute;inset:0;width:100%;height:100%}.status{margin-top:9px;padding:10px;border-radius:10px;background:#252c36;font-size:12px}.ok{background:#17392e}.warn{background:#493b18}.layer{padding:9px;margin:7px 0;border:1px solid #394352;border-radius:11px}.layer input{width:100%}.small{font-size:12px;color:#aeb8c6}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}.views{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.views img{width:100%;display:block}.hidden{display:none!important}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><b>MicroPlayer — Carte 3D Pro V32C</b><span>fond propre · plans uniques · 9 vues</span></header><main class="wrap"><div class="grid"><aside><section class="panel"><h2>1. Image</h2><input id="file" type="file" accept="image/*"><div class="actions"><button id="analyze" disabled>Reconnaître</button><button id="prepare" class="primary" disabled>Préparer relief</button></div><div id="status" class="status">Importez l’image validée.</div></section><section id="lp" class="panel hidden"><h2>2. Plans</h2><div id="layers"></div></section></aside><section><section class="panel"><h2>Carte</h2><div id="stage" class="stage"><canvas id="photo"></canvas></div></section><section id="settings" class="panel hidden"><h2>3. Relief lenticulaire</h2><div class="controls"><label>Amplitude <b id="aout">1,00×</b><input id="amp" type="range" min=".45" max="1.6" step=".05" value="1"></label><label>Parallaxe max <b id="pout">1,35%</b><input id="par" type="range" min=".4" max="2.4" step=".05" value="1.35"></label></div><div id="report" class="status"></div><button id="generate" class="primary" style="width:100%;margin-top:10px">Générer les 9 vues propres</button></section><section id="results" class="panel hidden"><h2>4. Simulation</h2><div class="sim"><canvas id="sim"></canvas></div><div class="actions" style="margin-top:8px"><button id="toggle">Pause</button><button id="zip" class="green">ZIP 9 vues</button></div><input id="range" type="range" min="0" max="8" step="1" value="4" style="width:100%"><div id="views" class="views"></div></section></section></div></main><script type="module">import{createSemanticMask,createBoxMask,maskCoverage}from'./business-card-depthflow-core.js';const $=id=>document.getElementById(id),photo=$('photo'),pc=photo.getContext('2d',{willReadFrequently:true}),S={img:null,data:null,rgba:null,layers:[],bg:null,urls:[],blobs:[],imgs:[],pos:4,play:false,raf:0,dir:1,last:0};const stat=(t,c='')=>{$('status').textContent=t;$('status').className='status '+c};const read=f=>new Promise((r,j)=>{const q=new FileReader;q.onload=()=>r(q.result);q.onerror=j;q.readAsDataURL(f)});const load=u=>new Promise((r,j)=>{const i=new Image;i.onload=()=>r(i);i.onerror=j;i.src=u});const blob=c=>new Promise(r=>c.toBlob(r,'image/png'));$('file').onchange=async()=>{const f=$('file').files?.[0];if(!f)return;S.data=await read(f);S.img=await load(S.data);const w=Math.min(2048,S.img.naturalWidth),h=Math.round(w*S.img.naturalHeight/S.img.naturalWidth);photo.width=w;photo.height=h;$('stage').style.aspectRatio=w+'/'+h;pc.drawImage(S.img,0,0,w,h);S.rgba=pc.getImageData(0,0,w,h).data;S.layers=[];S.bg=null;$('analyze').disabled=$('prepare').disabled=false;stat(`Image ${w} × ${h} prête.`,'ok')};function depthFor(r){const d=Number(r.depth255);if(Number.isFinite(d))return d;return({logo:245,name:230,title:210,social:202,phone:196,email:188,address:178,website:168,artwork:55,qr:128}[r.role]||128)}function make(r,i){let m=createSemanticMask(S.rgba,photo.width,photo.height,r.bbox,{threshold:r.type==='text'?24:34,softness:10,dilate:0});if(maskCoverage(m).percent<.006)m=createBoxMask(photo.width,photo.height,r.bbox,.25);return{id:r.id||String(i),label:r.label||r.text||`Plan ${i+1}`,role:r.role||'other',groupId:r.groupId||r.id||String(i),depth:depthFor(r),mask:m,bbox:r.bbox}}async function analyze(){stat('Reconnaissance fine…','warn');const r=await fetch('/api/card-layer-analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:S.data})}),d=await r.json();if(!r.ok)throw Error(d.error||r.status);S.layers=(d.layers||[]).map(make);renderLayers();$('lp').classList.remove('hidden');$('settings').classList.remove('hidden');S.bg=null;report();stat(`${S.layers.length} plans séparés.`,'ok')}$('analyze').onclick=()=>analyze().catch(e=>stat(e.message));$('prepare').onclick=()=>analyze().catch(e=>stat(e.message));function renderLayers(){const root=$('layers');root.innerHTML='';S.layers.forEach(l=>{const d=document.createElement('div');d.className='layer';d.innerHTML=`<b>${l.label}</b><div class="small">${l.role}</div><label>Profondeur <b>${l.depth}</b></label><input type="range" min="0" max="255" value="${l.depth}">`;const q=d.querySelector('input'),b=d.querySelector('label b');q.oninput=()=>{l.depth=+q.value;b.textContent=l.depth;report()};root.appendChild(d)})}function union(){const n=photo.width*photo.height,u=new Uint8ClampedArray(n);for(const l of S.layers)for(let i=0;i<n;i++)if(l.mask[i]>u[i])u[i]=l.mask[i];return u}function cleanBackground(){if(S.bg)return S.bg;const w=photo.width,h=photo.height,u=union(),src=pc.getImageData(0,0,w,h),d=new Uint8ClampedArray(src.data),valid=new Uint8Array(w*h);for(let i=0;i<valid.length;i++)valid[i]=u[i]<24?1:0;let remaining=valid.length-valid.reduce((a,b)=>a+b,0);for(let pass=0;pass<80&&remaining>0;pass++){const prevV=new Uint8Array(valid),prevD=new Uint8ClampedArray(d);let filled=0;for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;if(prevV[i])continue;let sr=0,sg=0,sb=0,n=0;for(let yy=-1;yy<=1;yy++)for(let xx=-1;xx<=1;xx++){if(!xx&&!yy)continue;const q=(y+yy)*w+x+xx;if(!prevV[q])continue;const j=q*4;sr+=prevD[j];sg+=prevD[j+1];sb+=prevD[j+2];n++}if(n>=2){const j=i*4;d[j]=sr/n;d[j+1]=sg/n;d[j+2]=sb/n;d[j+3]=255;valid[i]=1;filled++}}remaining-=filled;if(!filled)break}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').putImageData(new ImageData(d,w,h),0,0);S.bg=c;return c}function groupLayers(){const map=new Map;for(const l of S.layers){const k=l.groupId||l.id;if(!map.has(k))map.set(k,{depth:l.depth,layers:[]});const g=map.get(k);g.layers.push(l);g.depth=Math.round(g.layers.reduce((a,z)=>a+z.depth,0)/g.layers.length)}return[...map.values()]}function shift(depth,pos){const z=128,amp=+$('amp').value,par=+$('par').value/100,n=(depth-z)/(depth>=z?127:128);return-pos*n*amp*par*photo.width}function layerCanvas(l){const w=photo.width,h=photo.height,c=document.createElement('canvas'),x=c.getContext('2d'),im=x.createImageData(w,h);for(let i=0,j=0;i<l.mask.length;i++,j+=4){const a=l.mask[i];if(a<18)continue;im.data[j]=S.rgba[j];im.data[j+1]=S.rgba[j+1];im.data[j+2]=S.rgba[j+2];im.data[j+3]=a}x.putImageData(im,0,0);return c}function render(pos){const w=photo.width,h=photo.height,c=document.createElement('canvas'),x=c.getContext('2d');c.width=w;c.height=h;x.drawImage(cleanBackground(),0,0);for(const g of groupLayers().sort((a,b)=>a.depth-b.depth)){const dx=shift(g.depth,pos);for(const l of g.layers)x.drawImage(layerCanvas(l),dx,0)}return c}function report(){$('aout').textContent=(+$('amp').value).toFixed(2).replace('.',',')+'×';$('pout').textContent=(+$('par').value).toFixed(2).replace('.',',')+'%';if(!S.layers.length)return;$('report').textContent=`${S.layers.length} plans · fond reconstruit par propagation · aucun calque original conservé sous les éléments mobiles.`}$('amp').oninput=report;$('par').oninput=report;function stop(){S.play=false;if(S.raf)cancelAnimationFrame(S.raf)}function drawSim(i){if(S.imgs.length!==9)return;i=Math.max(0,Math.min(8,Math.round(i)));const c=$('sim'),x=c.getContext('2d');c.width=photo.width;c.height=photo.height;x.clearRect(0,0,c.width,c.height);x.drawImage(S.imgs[i],0,0);S.pos=i;$('range').value=i}function loop(t){if(!S.play)return;if(!S.last)S.last=t;if(t-S.last>190){S.last=t;S.pos+=S.dir;if(S.pos>=8){S.pos=8;S.dir=-1}else if(S.pos<=0){S.pos=0;S.dir=1}drawSim(S.pos)}S.raf=requestAnimationFrame(loop)}function start(){stop();S.play=true;S.last=0;S.raf=requestAnimationFrame(loop)}async function generate(){if(!S.layers.length)return;stat('Reconstruction du fond et génération…','warn');stop();S.urls.forEach(URL.revokeObjectURL);S.urls=[];S.blobs=[];S.imgs=[];$('views').innerHTML='';S.bg=null;for(let i=0;i<9;i++){const b=await blob(render((i-4)/4));S.blobs.push(b);const u=URL.createObjectURL(b);S.urls.push(u);const im=document.createElement('img');im.src=u;$('views').appendChild(im);await new Promise(requestAnimationFrame)}S.imgs=await Promise.all(S.urls.map(load));$('results').classList.remove('hidden');drawSim(4);start();stat('9 vues propres générées. Vérifie surtout les vues 1 et 9.','ok')}$('generate').onclick=generate;$('range').oninput=e=>{stop();drawSim(+e.target.value)};$('toggle').onclick=()=>S.play?stop():start();$('zip').onclick=async()=>{const z=new JSZip;S.blobs.forEach((b,i)=>z.file(`vue-${String(i+1).padStart(2,'0')}.png`,b));const b=await z.generateAsync({type:'blob'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='microplayer-v32c-9-vues.zip';a.click()};report()</script></body></html>
