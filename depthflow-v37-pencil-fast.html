<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MicroPlayer V37 Pencil rapide</title><style>body{margin:0;background:#0b0c10;color:#f5f7fa;font-family:-apple-system,system-ui;padding:16px}main{max-width:1050px;margin:auto}.card{background:#15171d;border:1px solid #292d36;border-radius:18px;padding:16px;margin:14px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,.file{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:#fff;color:#111}.file input{display:none}button.active{outline:3px solid #fff}.stage,.simstage{position:relative;background:#000;border-radius:14px;overflow:hidden;margin-top:12px;line-height:0}.stage canvas,.simstage canvas{width:100%;height:auto;display:block}.stage #overlay{position:absolute;inset:0;touch-action:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.view{position:relative;border-radius:10px;overflow:hidden;background:#000}.view canvas{width:100%;display:block}.badge{position:absolute;top:6px;left:6px;background:#000c;padding:4px 7px;border-radius:7px}.status{padding:11px;background:#20242d;border-radius:12px;margin-top:10px}.spectrum{height:28px;border-radius:8px;background:linear-gradient(90deg,#050505,#fff);border:1px solid #555}.controls{display:grid;grid-template-columns:170px 1fr 60px;gap:8px;align-items:center;margin:10px 0}.controls input{width:100%}.sim{display:none}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:120px 1fr 48px}}</style></head><body><main><h1>MicroPlayer — DepthFlow V37 Pencil rapide</h1><p>Carte continue noir → blanc. Le tracé Pencil est affiché immédiatement ; la carte complète n'est rafraîchie qu'à la fin du trait.</p><section class="card"><div class="row"><label class="file">Choisir photo<input id="file" type="file" accept="image/*"></label><button id="calc" disabled>1. Calculer profondeur</button><button id="gen" disabled>3. Générer 9 vues</button></div><div id="status" class="status">Prêt.</div></section><section class="card"><strong>2. Carte de profondeur + correction Pencil</strong><div class="spectrum"></div><div class="row"><span>Noir — loin</span><span style="margin-left:auto">Blanc — proche</span></div><div class="controls"><label>Profondeur Pencil</label><input id="level" type="range" min="0" max="255" value="128"><output id="levelOut">128</output></div><div class="controls"><label>Douceur</label><input id="soft" type="range" min="0.05" max="1" step="0.05" value="0.30"><output id="softOut">0.30</output></div><div class="controls"><label>Taille pinceau</label><input id="brush" type="range" min="4" max="120" value="32"><output id="brushOut">32</output></div><div class="row"><button id="paintBtn" class="active">✏️ Modifier profondeur</button><button id="eraseBtn">Gomme correction</button><button id="showBtn">Afficher carte</button><button id="resetBtn">Effacer corrections</button></div><div class="stage"><canvas id="photo"></canvas><canvas id="overlay"></canvas></div></section><section id="sim" class="card sim"><strong>Simulateur lenticulaire</strong><button id="auto">▶ Auto</button><div class="simstage"><canvas id="simc"></canvas></div><input id="simr" style="width:100%;margin-top:12px" type="range" min="0" max="8" step="0.01" value="4"></section><div id="grid" class="grid"></div></main><script type="module">import{pipeline,env}from'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0';env.allowLocalModels=false;const $=x=>document.getElementById(x),file=$('file'),calc=$('calc'),gen=$('gen'),status=$('status'),photo=$('photo'),overlay=$('overlay'),grid=$('grid'),sim=$('sim'),simc=$('simc'),simr=$('simr');let url,baseDepth,editDepth,weight,est,mode='paint',down=false,last,frames=[],run=false,dir=1,tm=0,showMap=false,rect=null;for(let id of['level','soft','brush'])$(id).oninput=()=>$(id+'Out').textContent=$(id).value;$('paintBtn').onclick=()=>{mode='paint';$('paintBtn').classList.add('active');$('eraseBtn').classList.remove('active')};$('eraseBtn').onclick=()=>{mode='erase';$('eraseBtn').classList.add('active');$('paintBtn').classList.remove('active')};file.onchange=async()=>{let f=file.files?.[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);let img=await load(url),w=Math.min(img.naturalWidth,1200),h=Math.round(img.naturalHeight*w/img.naturalWidth);photo.width=overlay.width=w;photo.height=overlay.height=h;photo.getContext('2d').drawImage(img,0,0,w,h);overlay.getContext('2d').clearRect(0,0,w,h);calc.disabled=false;gen.disabled=true;status.textContent='Photo prête.'};calc.onclick=async()=>{try{calc.disabled=true;status.textContent='Calcul Depth Anything…';if(!est)est=await pipeline('depth-estimation','onnx-community/depth-anything-v2-small',{device:'wasm'});let r=await est(url);baseDepth=toDepth(r.predicted_depth||r.depth,photo.width,photo.height);editDepth=document.createElement('canvas');editDepth.width=photo.width;editDepth.height=photo.height;editDepth.getContext('2d').drawImage(baseDepth,0,0);weight=document.createElement('canvas');weight.width=photo.width;weight.height=photo.height;gen.disabled=false;renderOverlay();status.textContent='Carte prête — Pencil V37 faible latence.'}catch(e){status.textContent='Erreur : '+e.message}finally{calc.disabled=false}};function point(e){return{x:(e.clientX-rect.left)*overlay.width/rect.width,y:(e.clientY-rect.top)*overlay.height/rect.height}}function segment(a,b){if(!editDepth)return;let v=+$('level').value,alpha=+$('soft').value,size=+$('brush').value,dc=editDepth.getContext('2d'),wc=weight.getContext('2d'),oc=overlay.getContext('2d');for(let c of[dc,wc,oc]){c.save();c.lineCap='round';c.lineJoin='round';c.lineWidth=size;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y)}if(mode==='erase'){wc.globalCompositeOperation='destination-out';wc.strokeStyle='#fff';wc.stroke();oc.globalCompositeOperation='destination-out';oc.strokeStyle='#fff';oc.stroke()}else{dc.globalAlpha=alpha;dc.strokeStyle=`rgb(${v},${v},${v})`;dc.stroke();wc.globalAlpha=Math.min(1,alpha+.15);wc.strokeStyle='#fff';wc.stroke();oc.globalAlpha=.48;oc.strokeStyle=`rgb(${v},${v},${v})`;oc.stroke()}for(let c of[dc,wc,oc])c.restore()}overlay.onpointerdown=e=>{if(!editDepth)return;down=true;rect=overlay.getBoundingClientRect();last=point(e);overlay.setPointerCapture(e.pointerId);segment(last,last);e.preventDefault()};overlay.onpointermove=e=>{if(!down)return;let evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(let ev of evs){let p=point(ev);segment(last,p);last=p}e.preventDefault()};function finish(e){if(!down)return;down=false;rect=null;renderOverlay();e.preventDefault()}overlay.onpointerup=finish;overlay.onpointercancel=finish;$('resetBtn').onclick=()=>{if(!baseDepth)return;editDepth.getContext('2d').clearRect(0,0,editDepth.width,editDepth.height);editDepth.getContext('2d').drawImage(baseDepth,0,0);weight.getContext('2d').clearRect(0,0,weight.width,weight.height);renderOverlay()};$('showBtn').onclick=()=>{showMap=!showMap;$('showBtn').textContent=showMap?'Masquer carte':'Afficher carte';renderOverlay()};function renderOverlay(){if(!editDepth)return;let x=overlay.getContext('2d');x.clearRect(0,0,overlay.width,overlay.height);x.globalAlpha=showMap?.72:.32;x.drawImage(showMap?editDepth:weight,0,0);x.globalAlpha=1}function finalDepth(){let c=document.createElement('canvas');c.width=photo.width;c.height=photo.height;let x=c.getContext('2d'),a=baseDepth.getContext('2d').getImageData(0,0,c.width,c.height),b=editDepth.getContext('2d').getImageData(0,0,c.width,c.height),w=weight.getContext('2d').getImageData(0,0,c.width,c.height),o=x.createImageData(c.width,c.height);for(let i=0;i<o.data.length;i+=4){let k=w.data[i]/255,v=Math.round(a.data[i]*(1-k)+b.data[i]*k);o.data[i]=o.data[i+1]=o.data[i+2]=v;o.data[i+3]=255}x.putImageData(o,0,0);return c}gen.onclick=()=>{let dep=finalDepth(),w=photo.width,h=photo.height,src=document.createElement('canvas');src.width=w;src.height=h;src.getContext('2d').drawImage(photo,0,0);grid.innerHTML='';frames=[];for(let i=0;i<9;i++){let c=document.createElement('canvas');c.width=w;c.height=h;if(i===4)c.getContext('2d').drawImage(src,0,0);else warp(c,src,dep,(i-4)/4);frames.push(c);let d=document.createElement('div');d.className='view',b=document.createElement('span');b.className='badge';b.textContent=String(i+1).padStart(2,'0')+(i===4?' — original':'');d.append(c,b);grid.append(d)}simc.width=w;simc.height=h;simr.value=4;draw(4);sim.style.display='block';status.textContent='V37 générée.';sim.scrollIntoView({behavior:'smooth',block:'start'})};function warp(out,src,dep,pos){let w=out.width,h=out.height,s=src.getContext('2d').getImageData(0,0,w,h),d=dep.getContext('2d').getImageData(0,0,w,h).data,x=out.getContext('2d'),o=x.createImageData(w,h);for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){let i=(y*w+xx)*4,z=d[i]/255-.5,sx=Math.max(0,Math.min(w-1,Math.round(xx+pos*z*w*.032))),q=(y*w+sx)*4;o.data[i]=s.data[q];o.data[i+1]=s.data[q+1];o.data[i+2]=s.data[q+2];o.data[i+3]=255}x.putImageData(o,0,0)}simr.oninput=()=>{run=false;draw(+simr.value)};function draw(v){if(!frames.length)return;let a=Math.floor(v),b=Math.min(8,a+1),m=v-a,x=simc.getContext('2d');x.globalAlpha=1;x.drawImage(frames[a],0,0);if(b!==a){x.globalAlpha=m;x.drawImage(frames[b],0,0);x.globalAlpha=1}}$('auto').onclick=()=>{run=!run;if(run){tm=performance.now();requestAnimationFrame(tick)}};function tick(t){if(!run)return;let dt=Math.min(.05,(t-tm)/1000);tm=t;let v=+simr.value+dir*dt*2;if(v>=8){v=8;dir=-1}if(v<=0){v=0;dir=1}simr.value=v;draw(v);requestAnimationFrame(tick)}function toDepth(raw,w,h){let data=raw?.data??raw?.cpuData??raw,dims=raw?.dims??raw?.shape??[];if(data?.data)data=data.data;let dd=Array.from(dims||[]),sw=raw?.width||dd.at(-1),sh=raw?.height||dd.at(-2);if(!sw||!sh){sw=Math.round(Math.sqrt(data.length*w/h));sh=Math.floor(data.length/sw)}let vals=[];for(let v of data){v=+v;if(Number.isFinite(v))vals.push(v)}vals.sort((a,b)=>a-b);let mn=vals[Math.floor(vals.length*.02)]??0,mx=vals[Math.floor(vals.length*.98)]??1,span=Math.max(1e-9,mx-mn),c=document.createElement('canvas');c.width=sw;c.height=sh;let x=c.getContext('2d'),im=x.createImageData(sw,sh);for(let i=0;i<sw*sh;i++){let v=+data[i];if(!Number.isFinite(v))v=mn;v=Math.max(0,Math.min(255,Math.round((v-mn)/span*255)));let j=i*4;im.data[j]=im.data[j+1]=im.data[j+2]=v;im.data[j+3]=255}x.putImageData(im,0,0);let o=document.createElement('canvas');o.width=w;o.height=h;o.getContext('2d').drawImage(c,0,0,w,h);return o}function load(u){return new Promise((r,j)=>{let i=new Image;i.onload=()=>r(i);i.onerror=j;i.src=u})}</script></body></html>
