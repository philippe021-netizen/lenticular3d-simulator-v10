<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MicroPlayer V41</title><style>html,body{margin:0;background:#0b0c10;color:#f5f7fa;font-family:-apple-system,system-ui}.panel{position:sticky;top:0;z-index:20;background:#15171df5;border-bottom:1px solid #292d36;padding:12px 16px}.panel h2{margin:0 0 8px}.controls{display:grid;grid-template-columns:180px 1fr 70px;gap:8px;align-items:center;max-width:1050px;margin:8px auto}.controls input{width:100%}.note{max-width:1050px;margin:auto;font-size:13px;color:#ddd}iframe{border:0;width:100%;height:calc(100vh - 190px);display:block}</style></head><body><div class="panel"><h2>V41 — relief renforcé</h2><div class="controls"><label>Contraste profondeur</label><input id="depth" type="range" min="50" max="250" step="5" value="140"><output id="do">140 %</output></div><div class="controls"><label>Amplitude vues 01↔09</label><input id="amp" type="range" min="50" max="350" step="5" value="180"><output id="ao">180 %</output></div><div class="note">Les deux réglages sont indépendants. Le premier accentue l'écart proche/loin ; le second augmente le déplacement latéral des vues. Commencer à 140 % / 180 %.</div></div><iframe id="app" src="depthflow-v40-relief.html"></iframe><script>const f=document.getElementById('app'),d=document.getElementById('depth'),a=document.getElementById('amp'),do_=document.getElementById('do'),ao=document.getElementById('ao');function sync(){do_.textContent=d.value+' %';ao.textContent=a.value+' %';let w=f.contentWindow;if(!w)return;let doc=w.document,r=doc.getElementById('relief');if(!r)return;r.max='875';let effective=(+d.value/100)*(+a.value/100)*100;r.value=Math.round(effective);r.dispatchEvent(new Event('input',{bubbles:true}));let lab=r.closest('.controls')?.querySelector('label');if(lab)lab.textContent='Relief combiné V41';let note=doc.querySelector('.warn');if(note)note.textContent='Piloté par V41 : contraste profondeur × amplitude des vues. La vue 05 reste l’original.'}f.onload=sync;d.oninput=sync;a.oninput=sync;</script></body></html>
