<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MicroPlayer — Zones d’action (test)</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111;color:#eee}header{padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#1c1c1e;position:sticky;top:0;z-index:5}button,label,.pill{background:#2c2c2e;border:1px solid #555;color:#fff;border-radius:10px;padding:9px 12px;font-size:15px}button.active{outline:2px solid #fff}input[type=file]{display:none}input[type=range]{width:120px}.wrap{height:calc(100vh - 70px);display:grid;place-items:center;overflow:hidden;touch-action:none}.stage{position:relative;transform-origin:center center}.stage img{display:block;max-width:92vw;max-height:82vh;user-select:none;-webkit-user-drag:none}.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.zones{display:flex;gap:6px;flex-wrap:wrap}.zone{padding:7px 10px}.hint{opacity:.72;font-size:13px}.sw{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px}.z1{background:#ff3b30}.z2{background:#0a84ff}.z3{background:#30d158}.z4{background:#ffd60a}
</style></head><body><header>
<label>📷 Charger photo<input id="file" type="file" accept="image/*"></label>
<div class="zones"><button class="zone active" data-z="0"><i class="sw z1"></i>Zone 1</button><button class="zone" data-z="1"><i class="sw z2"></i>Zone 2</button><button class="zone" data-z="2"><i class="sw z3"></i>Zone 3</button><button class="zone" data-z="3"><i class="sw z4"></i>Zone 4</button></div>
<button id="paint" class="active">✏️ Peindre</button><button id="erase">⌫ Gomme</button><span class="pill">Taille <input id="size" type="range" min="2" max="80" value="22"></span><button id="undo">↶</button><button id="clear">Effacer zone</button><button id="export">Exporter masques PNG</button><span class="hint">Apple Pencil/souris • pinceau/gomme • 4 zones séparées</span>
</header><main class="wrap" id="wrap"><div class="stage" id="stage"><img id="img" alt="Charge une photo"><canvas id="cv"></canvas></div></main>
<script>
const colors=[[255,59,48],[10,132,255],[48,209,88],[255,214,10]],file=document.querySelector('#file'),img=document.querySelector('#img'),cv=document.querySelector('#cv'),ctx=cv.getContext('2d'),stage=document.querySelector('#stage');let z=0,erase=false,drawing=false,last=null,masks=[],history=[];
function setup(){cv.width=img.naturalWidth;cv.height=img.naturalHeight;stage.style.width=img.clientWidth+'px';stage.style.height=img.clientHeight+'px';masks=colors.map(()=>new Uint8ClampedArray(cv.width*cv.height));history=[];render()}
file.onchange=e=>{const f=e.target.files[0];if(!f)return;img.onload=setup;img.src=URL.createObjectURL(f)};addEventListener('resize',()=>{if(img.src){stage.style.width=img.clientWidth+'px';stage.style.height=img.clientHeight+'px'}});
document.querySelectorAll('.zone').forEach(b=>b.onclick=()=>{document.querySelectorAll('.zone').forEach(x=>x.classList.remove('active'));b.classList.add('active');z=+b.dataset.z;render()});
paint.onclick=()=>{erase=false;paint.classList.add('active');document.querySelector('#erase').classList.remove('active')};document.querySelector('#erase').onclick=()=>{erase=true;document.querySelector('#erase').classList.add('active');paint.classList.remove('active')};
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
function stamp(x,y){const rad=+size.value*cv.width/cv.getBoundingClientRect().width,arr=masks[z];const x0=Math.max(0,Math.floor(x-rad)),x1=Math.min(cv.width-1,Math.ceil(x+rad)),y0=Math.max(0,Math.floor(y-rad)),y1=Math.min(cv.height-1,Math.ceil(y+rad));for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++)if((xx-x)**2+(yy-y)**2<=rad**2)arr[yy*cv.width+xx]=erase?0:255}
function line(a,b){const d=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(d/3));for(let i=0;i<=n;i++)stamp(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n)}
cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);history.push(masks[z].slice());if(history.length>20)history.shift();drawing=true;last=pos(e);stamp(last.x,last.y);render()};cv.onpointermove=e=>{if(!drawing)return;e.preventDefault();const p=pos(e);line(last,p);last=p;render()};cv.onpointerup=cv.onpointercancel=()=>{drawing=false;last=null};
function render(){ctx.clearRect(0,0,cv.width,cv.height);if(!masks.length)return;const id=ctx.createImageData(cv.width,cv.height);for(let k=0;k<masks.length;k++){const a=masks[k],c=colors[k];for(let i=0;i<a.length;i++)if(a[i]){const q=i*4;id.data[q]=c[0];id.data[q+1]=c[1];id.data[q+2]=c[2];id.data[q+3]=95}}ctx.putImageData(id,0,0)}
undo.onclick=()=>{if(history.length){masks[z]=history.pop();render()}};clear.onclick=()=>{history.push(masks[z].slice());masks[z].fill(0);render()};
export.onclick=()=>{if(!masks.length)return;masks.forEach((a,k)=>{const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;const x=c.getContext('2d'),id=x.createImageData(c.width,c.height);for(let i=0;i<a.length;i++){const q=i*4;id.data[q]=id.data[q+1]=id.data[q+2]=255;id.data[q+3]=a[i]}x.putImageData(id,0,0);c.toBlob(b=>{const u=URL.createObjectURL(b),A=document.createElement('a');A.href=u;A.download=`action-zone-${k+1}.png`;A.click();setTimeout(()=>URL.revokeObjectURL(u),1000)},'image/png')})};
</script></body></html>
