<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LentiPrint Lab — Relief 3D test</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#151515;background:#f5f5f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:330px 1fr;gap:16px}.viewer{min-height:520px;background:#05070b;border-radius:14px;overflow:hidden}.viewer canvas{display:block;width:100%;height:100%}input,button{font:inherit}.field{margin:14px 0}.field label{display:flex;justify-content:space-between;font-weight:700;font-size:13px}.field input[type=range]{width:100%}button{border:0;border-radius:12px;padding:12px 15px;background:#111;color:#fff;font-weight:700;cursor:pointer;margin:6px 6px 6px 0}button.secondary{background:#eee;color:#111}button:disabled{opacity:.45}.status{padding:11px;background:#f2f2f2;border-radius:10px;white-space:pre-wrap}.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.frames img{width:100%;border-radius:8px;border:1px solid #ddd}@media(max-width:760px){.grid{grid-template-columns:1fr}.viewer{min-height:420px}}
</style>
</head>
<body><div class="wrap">
<h1>LentiPrint Lab — Relief 3D</h1>
<p>Photo unique → carte de profondeur locale → 9 vues. Aucun PixVerse, aucune génération vidéo.</p>
<div class="card grid">
<section>
<div class="field"><label>Photo</label><input id="photo" type="file" accept="image/*"></div>
<div class="field"><label><span>Force du relief</span><span id="strengthValue">0.42</span></label><input id="strength" type="range" min="0.20" max="0.70" step="0.02" value="0.42"></div>
<div class="field"><label><span>Amplitude</span><span id="angleValue">±8°</span></label><input id="angle" type="range" min="4" max="10" step="1" value="8"></div>
<button id="build" disabled>Créer le relief 3D</button>
<button id="export" class="secondary" disabled>Exporter les 9 vues</button>
<button id="download" class="secondary" disabled>Télécharger ZIP</button>
<div id="status" class="status">Choisis une photo.</div>
</section>
<section><div id="viewer" class="viewer"></div><div id="frames" class="frames"></div></section>
</div></div>
<script type="module">
const $=s=>document.querySelector(s);
const photo=$('#photo'), build=$('#build'), exp=$('#export'), download=$('#download');
const status=$('#status'), viewer=$('#viewer'), frames=$('#frames');
const strength=$('#strength'), angle=$('#angle');
const strengthValue=$('#strengthValue'), angleValue=$('#angleValue');
let engine=null, currentViews=[];
function setStatus(t){ status.textContent=t; }
strength.oninput=()=>{ strengthValue.textContent=Number(strength.value).toFixed(2); engine?.setStrength(Number(strength.value)); };
angle.oninput=()=>{ angleValue.textContent=`±${angle.value}°`; engine?.setMaxAngle(Number(angle.value)); };
photo.onchange=()=>{ build.disabled=!(photo.files&&photo.files[0]); exp.disabled=true; download.disabled=true; frames.innerHTML=''; setStatus(build.disabled?'Choisis une photo.':'Photo prête.'); };
async function getEngine(){ if(engine) return engine; engine=await import('/relief-engine.js'); await engine.init(viewer); return engine; }
build.onclick=async()=>{ try{ build.disabled=true; const e=await getEngine(); await e.buildFromPhoto(photo.files[0],setStatus,{strength:Number(strength.value),angle:Number(angle.value)}); exp.disabled=false; }catch(err){console.error(err);setStatus('Erreur : '+(err?.message||err));}finally{build.disabled=false;} };
exp.onclick=async()=>{ try{ exp.disabled=true; frames.innerHTML=''; const e=await getEngine(); currentViews=await e.exportNineViews((i,n,a)=>setStatus(`Export ${i}/${n} — ${a.toFixed(1)}°`)); currentViews.forEach(v=>{const img=new Image();img.src=URL.createObjectURL(v.blob);img.alt=`Vue ${v.index}`;frames.appendChild(img);}); download.disabled=false; setStatus('9 vues prêtes.'); }catch(err){console.error(err);setStatus('Erreur export : '+(err?.message||err));}finally{exp.disabled=false;} };
download.onclick=async()=>{ if(currentViews.length!==9) return; const zip=new JSZip(); currentViews.forEach(v=>zip.file(v.filename,v.blob)); zip.file('manifest.json',JSON.stringify({generator:'LentiPrint Lab Relief 3D prototype',views:9,angle:Number(angle.value),strength:Number(strength.value),source:'photo unique + Depth Anything local'},null,2)); const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'}); const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='9-vues-relief-3d.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000); };
</script></body></html>
