<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MicroPlayer — Test Tiefling photo entière</title><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><style>body{margin:0;background:#0d1117;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#151b23;border:1px solid #2b3442;border-radius:14px;padding:16px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:12px 0}input[type=file],input[type=range]{width:100%}button{border:1px solid #2b3442;background:#ffb300;color:#111;border-radius:10px;padding:11px 14px;font-weight:800}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btns button.secondary{background:#26323e;color:#fff}.stage{margin-top:14px;min-height:420px;display:grid;place-items:center;background:#05080b;border-radius:12px;overflow:hidden}.stage canvas{max-width:100%;max-height:68vh}.thumbs{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-top:10px}.thumbs canvas{width:100%;background:#000;border:2px solid transparent;border-radius:5px}.thumbs canvas.active{border-color:#ffb300}.status{margin-top:10px;color:#b8c5d3}.playRow{display:flex;gap:10px;align-items:center;margin-top:12px}.playRow input{flex:1}@media(max-width:800px){.thumbs{grid-template-columns:repeat(3,1fr)}}</style></head><body><div class="wrap"><h1>Test Tiefling — photo entière</h1><div class="card"><p>Aucun détourage : toute la photo passe dans une seule carte de profondeur Tiefling.</p><input id="file" type="file" accept="image/*"><div class="row"><label>Définition profondeur</label><strong id="sizeVal">518</strong></div><input id="size" type="range" min="322" max="798" step="28" value="518"><div class="row"><label>Amplitude relief / parallaxe</label><strong id="ampVal">26 px</strong></div><input id="amp" type="range" min="4" max="60" value="26"><div class="btns"><button id="go">Calculer les 9 vues</button><button id="play" class="secondary" disabled>▶ Lecture</button><button id="zip" class="secondary" disabled>ZIP 9 vues</button><button id="png" class="secondary" disabled>Exporter vue PNG</button></div><div class="playRow"><span>Vue</span><input id="slider" type="range" min="1" max="9" value="5" disabled><strong id="label">5 / 9</strong></div><div class="row"><label>Vitesse lecture</label><strong id="speedVal">180 ms</strong></div><input id="speed" type="range" min="80" max="600" step="20" value="180"><div id="status" class="status">Choisis la photo IMG_5193.jpeg, puis calcule.</div><div id="stage" class="stage"><span>Aperçu après calcul</span></div><div id="thumbs" class="thumbs"></div></div></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),MODEL='https://raw.githubusercontent.com/combatwombat/tiefling/main/site/public/models/depthanythingv2-vits-dynamic-quant.onnx',worker=new Worker('./tiefling-dual-worker.js',{type:'module'});let img,pending,frames=[],current=4,playing=false,timer=null,dir=1;const stat=t=>$('status').textContent=t;function imgFromFile(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=rej;i.src=u})}function pack(im,size){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#000';x.fillRect(0,0,size,size);const s=Math.min(size/im.naturalWidth,size/im.naturalHeight),w=im.naturalWidth*s,h=im.naturalHeight*s,dx=(size-w)/2,dy=(size-h)/2;x.drawImage(im,dx,dy,w,h);return{data:x.getImageData(0,0,size,size),r:{dx,dy,w,h}}}function infer(im,size){return new Promise((res,rej)=>{if(pending)return rej(new Error('Moteur occupé'));const p=pack(im,size);pending={res,rej,r:p.r};worker.postMessage({imageData:p.data,size,modelUrl:MODEL})})}worker.onmessage=e=>{if(!pending)return;const p=pending;pending=null;e.data?.ok?p.res({...e.data,rect:p.r}):p.rej(new Error(e.data?.error||'Erreur Tiefling'))};worker.onerror=e=>{if(pending){pending.rej(new Error(e.message));pending=null}};function depthToOriginal(res,im){const tmp=document.createElement('canvas');tmp.width=res.width;tmp.height=res.height;tmp.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(res.data),res.width,res.height),0,0);const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d',{willReadFrequently:true}),r=res.rect;x.drawImage(tmp,r.dx,r.dy,r.w,r.h,0,0,c.width,c.height);return x.getImageData(0,0,c.width,c.height)}function srcCanvas(im){const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);return c}function sample(d,w,h,x,y,ch){x=Math.max(0,Math.min(w-1,x));y=Math.max(0,Math.min(h-1,y));const x0=Math.floor(x),y0=Math.floor(y),x1=Math.min(w-1,x0+1),y1=Math.min(h-1,y0+1),fx=x-x0,fy=y-y0,a=d[(y0*w+x0)*4+ch],b=d[(y0*w+x1)*4+ch],c=d[(y1*w+x0)*4+ch],dd=d[(y1*w+x1)*4+ch];return(a*(1-fx)+b*fx)*(1-fy)+(c*(1-fx)+dd*fx)*fy}function warp(src,dep,t,amp){const w=src.width,h=src.height,out=document.createElement('canvas');out.width=w;out.height=h;const sx=src.getContext('2d',{willReadFrequently:true}),sd=sx.getImageData(0,0,w,h),x=out.getContext('2d'),id=x.createImageData(w,h),od=id.data,dd=dep.data;for(let y=0;y<h;y++){for(let xx=0;xx<w;xx++){const z=(dd[(y*w+xx)*4]/255-.5);const shift=t*amp*(.30+z*1.55);const px=xx-shift;const o=(y*w+xx)*4;od[o]=sample(sd.data,w,h,px,y,0);od[o+1]=sample(sd.data,w,h,px,y,1);od[o+2]=sample(sd.data,w,h,px,y,2);od[o+3]=255}}x.putImageData(id,0,0);return out}function show(i){if(!frames.length)return;current=Math.max(0,Math.min(8,i));const st=$('stage');st.innerHTML='';st.appendChild(frames[current]);$('slider').value=current+1;$('label').textContent=(current+1)+' / 9';[...$('thumbs').children].forEach((c,j)=>c.classList.toggle('active',j===current))}function stopPlay(){playing=false;if(timer){clearTimeout(timer);timer=null}$('play').textContent='▶ Lecture'}function tick(){if(!playing)return;let n=current+dir;if(n>=8){n=8;dir=-1}else if(n<=0){n=0;dir=1}show(n);timer=setTimeout(tick,+$('speed').value)}function togglePlay(){if(!frames.length)return;if(playing){stopPlay();return}playing=true;dir=current>=8?-1:1;$('play').textContent='⏸ Pause';tick()}function canvasBlob(c){return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('PNG impossible')),'image/png'))}function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}async function exportZip(){if(!frames.length)return;stat('Création du ZIP…');const zip=new JSZip();for(let i=0;i<frames.length;i++)zip.file('tiefling-full-'+String(i+1).padStart(2,'0')+'.png',await canvasBlob(frames[i]));downloadBlob(await zip.generateAsync({type:'blob'}),'Tiefling_Photo_Entiere_9_vues.zip');stat('ZIP 9 vues exporté.')}async function exportPng(){if(!frames.length)return;downloadBlob(await canvasBlob(frames[current]),'tiefling-full-vue-'+String(current+1).padStart(2,'0')+'.png')}async function run(){try{stopPlay();const f=$('file').files[0];if(!f)return stat('Choisis d’abord la photo.');img=await imgFromFile(f);stat('Tiefling analyse toute la photo…');const dep=depthToOriginal(await infer(img,+$('size').value),img),src=srcCanvas(img),amp=+$('amp').value;frames=[];$('thumbs').innerHTML='';for(let i=0;i<9;i++){const t=(i-4)/4,cv=warp(src,dep,t,amp);frames.push(cv);const th=document.createElement('canvas');th.width=cv.width;th.height=cv.height;th.getContext('2d').drawImage(cv,0,0);th.onclick=()=>{stopPlay();show(i)};$('thumbs').appendChild(th)}$('play').disabled=$('zip').disabled=$('png').disabled=$('slider').disabled=false;show(4);stat('9 vues calculées. Lecture et export disponibles.')}catch(e){stat('Erreur : '+e.message)}}$('go').onclick=run;$('play').onclick=togglePlay;$('zip').onclick=()=>exportZip().catch(e=>stat('Erreur export : '+e.message));$('png').onclick=()=>exportPng().catch(e=>stat('Erreur export : '+e.message));$('slider').oninput=e=>{stopPlay();show(+e.target.value-1)};$('size').oninput=e=>$('sizeVal').textContent=e.target.value;$('amp').oninput=e=>$('ampVal').textContent=e.target.value+' px';$('speed').oninput=e=>$('speedVal').textContent=e.target.value+' ms';})();</script></body></html>
