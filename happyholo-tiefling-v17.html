<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HappyHolo — Tiefling V17</title><style>html,body{margin:0;width:100%;height:100%;background:#0d1117;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{position:fixed;z-index:30;left:12px;right:12px;top:10px;background:#101923ee;border:1px solid #344454;border-radius:14px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top b{margin-right:auto}.top label{background:#ffb300;color:#111;padding:9px 12px;border-radius:10px;font-weight:800;cursor:pointer}.top input{display:none}.top button{border:1px solid #455665;background:#222d38;color:#fff;border-radius:10px;padding:9px 12px;font-weight:800}.state{font-size:12px;color:#aebdcc}.frame{position:absolute;inset:0;padding-top:76px}.frame iframe{width:100%;height:100%;border:0;display:block}</style></head><body><div class="top"><b>V17 — fond remplaçable</b><label>🖼 Remplacer le fond<input id="replacement" type="file" accept="image/*"></label><button id="clear">Revenir au fond reconstruit</button><span id="state" class="state">Aucun fond de remplacement choisi.</span></div><div class="frame"><iframe id="v16" src="./happyholo-tiefling-v16.html?v=490" title="HappyHolo V17"></iframe></div><script>
(()=>{
const outer=document.getElementById('v16'),input=document.getElementById('replacement'),state=document.getElementById('state'),clear=document.getElementById('clear');let chosen=null;
function getInnerDoc(){try{const d1=outer.contentDocument,app=d1?.getElementById('app');return app?.contentDocument||null}catch(_){return null}}
function transferFile(file){const d=getInnerDoc();if(!d||!file)return false;const target=d.getElementById('customBgFile');if(!target)return false;const dt=new DataTransfer();dt.items.add(file);target.files=dt.files;target.dispatchEvent(new Event('change',{bubbles:true}));state.textContent='Fond remplacé : '+file.name+' — seul le calcul du fond est relancé.';return true}
input.onchange=()=>{chosen=input.files?.[0]||null;if(!chosen)return;let tries=0;const run=()=>{tries++;if(transferFile(chosen))return;if(tries<30)setTimeout(run,180)};run()};
clear.onclick=()=>{chosen=null;input.value='';state.textContent='Fond reconstruit réactivé au prochain détourage.';};
outer.addEventListener('load',()=>{if(chosen)setTimeout(()=>transferFile(chosen),500)});
})();
</script></body></html>
